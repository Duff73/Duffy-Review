<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>โปรไฟล์ | Duffy Review</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{if(!localStorage.getItem('duffy-member')&&!localStorage.getItem('duffy-admin'))location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));}catch(_){}</script>
<script>try{const t=localStorage.getItem('duffy-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
/* ส่วนเสริมเฉพาะหน้าโปรไฟล์ (ใช้ธีมจาก site.css) */
.phero .hin{grid-template-columns:auto minmax(0,1fr);gap:30px}
.phero.img{background:linear-gradient(90deg,rgba(20,14,48,.9) 0%,rgba(20,14,48,.6) 50%,rgba(20,14,48,.2) 100%),var(--bimg) center/cover no-repeat}
.phero.img::before,.phero.img::after{display:none}
.avw{position:relative;align-self:center}
.pav{width:136px;height:136px;font-size:52px;border:5px solid rgba(255,255,255,.92);box-shadow:0 20px 44px rgba(20,10,60,.4)}
.phero p.d{-webkit-line-clamp:unset;display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:18px}
.phero p.d.empty{opacity:.7;font-style:italic}
@media(max-width:860px){.phero .hin{grid-template-columns:1fr;gap:16px}.pav{width:104px;height:104px;font-size:40px}.avw{justify-self:start}}

/* ปุ่มดินสอ */
.pen{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#fff;color:#2b1a6b;box-shadow:0 4px 14px rgba(20,10,60,.3);transition:transform .15s,background .15s;flex:none;vertical-align:middle}
.pen:hover{transform:scale(1.1)}
.pen svg{width:16px;height:16px}
.pen.sm{width:30px;height:30px;background:rgba(255,255,255,.18);color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.35)}
.pen.sm:hover{background:rgba(255,255,255,.3)}
.pen.dk{background:var(--sf2);color:var(--tx);box-shadow:none;border:1px solid var(--bd);width:32px;height:32px}
.pen.dk:hover{border-color:var(--ac);color:var(--ac)}
.avw .pen{position:absolute;right:4px;bottom:4px;width:38px;height:38px;border:3px solid #fff;background:var(--ac);color:#fff}
.avw .pen svg{width:17px;height:17px}
.bnpen{position:absolute;top:16px;right:16px;z-index:2;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px 7px 11px;background:rgba(15,10,40,.45);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:13px;font-weight:500;backdrop-filter:blur(4px)}
.bnpen:hover{background:rgba(15,10,40,.65)}.bnpen svg{width:15px;height:15px}
.nmrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.nmrow h1{margin:0}
.biorow{display:flex;gap:10px;align-items:flex-start}
.biorow p.d{flex:0 1 auto}

/* เมนูเล็กของดินสอ */
.pop{position:absolute;z-index:20;min-width:200px;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh2);padding:6px}
.pop button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;font-size:14px}
.pop button:hover{background:var(--sf2)}.pop button svg{width:16px;height:16px;color:var(--mu)}

/* ช่องแก้ไขในหน้า */
.ed input,.ed textarea{width:100%;font:inherit;color:#fff;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.55);border-radius:12px;padding:8px 12px;outline:0}
.ed input:focus,.ed textarea:focus{border-color:#fff;background:rgba(255,255,255,.2)}
.ed input{font-size:clamp(22px,3vw,34px);font-weight:700;max-width:520px}
.ed textarea{font-size:15px;resize:vertical;max-width:560px;display:block}
.ed .bar2{display:flex;align-items:center;gap:8px;margin:8px 0 14px;font-size:13px}
.ed .bar2 .c{opacity:.8;margin-right:auto}
.ed .ok,.ed .no{border-radius:10px;padding:6px 14px;font-weight:600;font-size:13px}
.ed .ok{background:#fff;color:#2b1a6b}.ed .no{border:1px solid rgba(255,255,255,.55);color:#fff}
.ed .ok:disabled{opacity:.6;cursor:wait}
.favbox{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:var(--sh)}
.favbox .top{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:14px}
.favbox .top b{margin-right:auto}
.gp{display:flex;flex-wrap:wrap;gap:8px;max-height:200px;overflow-y:auto;padding:2px}
.gp .chip:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled{opacity:.6;cursor:wait}
.info h2{display:flex;align-items:center;gap:10px}

.act a{flex:1;text-align:center;border-radius:11px;padding:9px;font-size:13.5px;font-weight:500;border:1px solid var(--bd);background:var(--sf2)}
.act a:hover{border-color:var(--mu)}
.act a.b1{background:var(--ac);border-color:var(--ac);color:#fff}.act a.b1:hover{filter:brightness(1.06)}
.cb h3 a:hover{color:var(--ac)}
.cv{display:block}
.sec+.sec{margin-top:28px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;font-size:14px}
.kv:nth-child(odd){background:var(--sf2)}
.kv b{font-weight:600}
a.cmt{color:inherit}a.cmt:hover p{color:var(--ac)}
.box .cmt:first-of-type{border-top:0}
.cmt .g{font-size:13px;color:var(--mu)}.cmt .g b{color:var(--tx);font-weight:600}
.err{text-align:center;padding:90px 16px;color:var(--mu)}.err b{display:block;color:var(--tx);font-size:20px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--sf);padding:10px 18px;border-radius:12px;font-size:14px;font-weight:500;z-index:99;box-shadow:var(--sh2);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}.toast.er{background:var(--bad);color:#fff}
.busy{position:absolute;inset:0;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600}
</style>
</head>
<body>

<header><div class="wrap bar">
  <a class="logo" href="./" aria-label="หน้าแรก Duffy Review"><i>D</i><span>Duffy <b>Review</b></span></a>
  <nav class="nav" aria-label="เมนูหลัก"><a class="nb" href="./">หน้าแรก</a><span class="nb on">โปรไฟล์</span></nav>
  <span class="sp" style="flex:1"></span>
  <button class="ib" id="theme" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด"></button>
  <div class="acct" id="acct"></div>
</div></header>

<main class="wrap" id="main"><div class="err">กำลังโหลดโปรไฟล์...</div></main>
<footer>© 2026 Duffy Review</footer>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

<script src="config.js"></script>
<script>
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgUrl=s=>/^\/api\/images\/\d+$/.test(s)?API+s:/%[0-9a-f]{2}/i.test(s)?s:encodeURI(s);
const isImg=s=>/^\/api\/images\/\d+$/.test(s||'');
const fillBg=g=>`linear-gradient(135deg,hsl(${g.hue??200},70%,45%),hsl(${((g.hue??200)+60)%360},65%,30%))`;
const art=g=>`<div class="fill" style="background:${fillBg(g)}"></div>${g.image?`<img src="${esc(imgUrl(g.image))}" alt="" loading="lazy" onerror="this.remove()">`:''}`;
const ring=s=>`<span class="ring" style="--v:${Math.max(0,Math.min(100,s*10))}"><b>${s}</b></span>`;
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const thDate=(d,long)=>{try{return new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:long?'long':'short',year:'numeric'})}catch(_){return d}};
const I={
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/><path d="M14.5 5.5l3 3"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 13.5h.01"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};

/* ---------- โหมดสว่าง/มืด (เหมือนหน้าแรก) ---------- */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const paintTheme=()=>$('#theme').innerHTML=isDark()?I.sun:I.moon;
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('duffy-theme',t)}catch(_){}paintTheme();};
paintTheme();

let toastT;
function toast(t,err){const e=$('#toast');e.textContent=t;e.className='toast show'+(err?' er':'');clearTimeout(toastT);toastT=setTimeout(()=>e.className='toast'+(err?' er':''),2400);}

/* ---------- บัญชี ---------- */
let mtoken=null,ADMIN=false,ME=null;
try{mtoken=localStorage.getItem('duffy-member')}catch(_){}
if(!mtoken){try{const a=JSON.parse(localStorage.getItem('duffy-admin')||'null');if(a&&a.token){mtoken=a.token;ADMIN=true;}}catch(_){}}
const hdr=(type='application/json')=>{const h={'Content-Type':type};if(mtoken)h.Authorization='Bearer '+mtoken;return h;};
function toLogin(){try{localStorage.removeItem(ADMIN?'duffy-admin':'duffy-member')}catch(_){}location.replace('login.html?next='+encodeURIComponent(location.pathname+location.search));}
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:hdr()});if(r.status===401){toLogin();throw new Error('401');}const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||r.status),{status:r.status,field:d.field});return d;}
const avHtml=(u,cls='')=>`<span class="av ${cls}">${esc(([...String(u.name||'?')][0]||'?').toUpperCase())}${u.avatar?`<img src="${esc(imgUrl(u.avatar))}" alt="">`:''}</span>`;
function renderAcct(){
  $('#acct').innerHTML=ME?`<a class="me" href="profile.html" title="โปรไฟล์ของฉัน (@${esc(ME.username)})">${avHtml(ME)}<span class="nm">${esc(ME.name)}</span></a><button class="out" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">${I.out}<span class="t">ออกจากระบบ</span></button>`
    :ADMIN?`<a class="out" href="admin.html">หน้าผู้ดูแล</a>`:'';
  const b=$('#logoutBtn');if(b)b.onclick=async()=>{try{await fetch(API+'/api/auth/logout',{method:'POST',headers:hdr()})}catch(_){}try{localStorage.removeItem('duffy-member')}catch(_){}location.replace('login.html?out=1');};
}

/* ---------- การ์ดเกม (ชิ้นเดียวกับหน้าแรก) ---------- */
const card=g=>{const h=`./#game-${g.id}`;return `<article class="card">
<a class="cv" href="${h}" aria-label="อ่านรีวิว ${esc(g.title)}">${art(g)}<span class="age">${g.age}+</span>${ring(g.score)}</a>
<div class="cb"><span class="tag">${esc(g.category)}</span><h3><a href="${h}">${esc(g.title)}</a></h3><p>${esc(g.desc||'')}</p>
<div class="mt"><span>${I.eye}${fmt(g.views)}</span><span>${I.chat}${g.commentCount??0}</span>${g.platforms?`<span class="pf" title="${esc(g.platforms)}">${I.pad}<i>${esc(g.platforms)}</i></span>`:''}</div>
<div class="act"><a class="b1" href="${h}">อ่านรีวิว</a><a href="${h}">ความคิดเห็น (${g.commentCount??0})</a></div></div></article>`;};

/* ---------- วาดหน้า ---------- */
let P=null,GAMES=[],editing=null,favDraft=null,busy=null;
const pen=(what,label,cls='')=>P.isMe?`<button class="pen ${cls}" data-pen="${what}" aria-label="${label}" title="${label}">${I.pen}</button>`:'';
function favGames(ids){return ids.map(id=>GAMES.find(g=>g.id===id)||P.user.favs.find(g=>g.id===id)).filter(Boolean);}

function heroHtml(){
  const u=P.user,img=isImg(u.banner),me=P.isMe;
  const nameHtml=editing==='name'
    ?`<div class="ed"><input id="ein" maxlength="30" value="${esc(u.name)}" aria-label="ชื่อที่แสดง"><div class="bar2"><span class="c" id="ecnt"></span><button class="no" data-x>ยกเลิก</button><button class="ok" data-ok="name">บันทึก</button></div></div>`
    :`<div class="nmrow"><h1>${esc(u.name)}</h1>${pen('name','แก้ไขชื่อที่แสดง','sm')}</div>`;
  const bioHtml=editing==='bio'
    ?`<div class="ed"><textarea id="ein" rows="3" maxlength="160" aria-label="แนะนำตัว" placeholder="เล่าสั้นๆ ว่าชอบเกมแนวไหน เล่นบนเครื่องอะไร">${esc(u.bio)}</textarea><div class="bar2"><span class="c" id="ecnt"></span><button class="no" data-x>ยกเลิก</button><button class="ok" data-ok="bio">บันทึก</button></div></div>`
    :`<div class="biorow"><p class="d${u.bio?'':' empty'}">${u.bio?esc(u.bio):(me?'ยังไม่ได้เขียนแนะนำตัว':'')}</p>${pen('bio','แก้ไขแนะนำตัว','sm')}</div>`;
  return `<section class="hero phero${img?' img':''}"${img?` style="--bimg:url('${esc(imgUrl(u.banner))}')"`:''}>
${me?`<button class="bnpen" data-pen="banner" aria-label="เปลี่ยนแบนเนอร์">${I.pen}แบนเนอร์</button>`:''}
<div class="hin">
<div class="avw">${avHtml(u,'pav')}${busy==='avatar'?'<span class="busy">กำลังอัปโหลด</span>':''}${pen('avatar','เปลี่ยนรูปโปรไฟล์')}</div>
<div><div class="kick"><i>D</i>สมาชิก Duffy Review</div>
${nameHtml}
<p class="site">@${esc(u.username)} · เป็นสมาชิกตั้งแต่ ${thDate(u.created,true)}</p>
${bioHtml}
<div class="hbtns"><a class="btn o" href="./">${I.home}กลับหน้าแรก</a></div>
</div></div></section>`;
}
function render(){
  const u=P.user;
  document.title=`${u.name} (@${u.username}) | Duffy Review`;
  const favs=u.favs;
  const picker=editing==='favs'?`<div class="favbox"><div class="top"><b>เลือกเกมโปรด (ได้สูงสุด 3 เกม)</b><span class="mu">${favDraft.length}/3</span><button class="btn g" data-x>ยกเลิก</button><button class="btn a" data-ok="favs">บันทึก</button></div>
<div class="gp">${GAMES.map(g=>{const on=favDraft.includes(g.id);return `<button class="chip ${on?'on':''}" data-g="${g.id}" ${!on&&favDraft.length>=3?'disabled':''}>${esc(g.title)}</button>`;}).join('')||'<span class="mu">โหลดรายชื่อเกมไม่สำเร็จ</span>'}</div></div>`:'';
  const shown=editing==='favs'?favGames(favDraft):favs;
  $('#main').innerHTML=heroHtml()+`<div class="layout"><section>
<div class="sec"><div class="info"><h2>เกมโปรด ${editing==='favs'?'':pen('favs','แก้ไขเกมโปรด','dk')}</h2><span class="cnt">${shown.length} เกม</span></div>
${picker}
${shown.length?`<div class="grid">${shown.map(card).join('')}</div>`:(editing==='favs'?'':`<div class="empty"><b>ยังไม่ได้เลือกเกมโปรด</b>${P.isMe?'กดรูปดินสอข้างหัวข้อเพื่อเลือกได้สูงสุด 3 เกม':''}</div>`)}</div>
<div class="sec"><div class="info"><h2>ความคิดเห็นล่าสุด</h2><span class="cnt">${P.stats.comments} รายการ</span></div>
<div class="box">${P.recent.length?P.recent.map(c=>`<a class="cmt" href="./#game-${c.gameId}">${avHtml(u)}<div><div class="g">ใน <b>${esc(c.gameTitle)}</b> · ${thDate(c.date)}</div><p>${esc(c.text)}</p></div></a>`).join(''):'<p class="mu" style="margin:6px 4px">ยังไม่มีความคิดเห็น</p>'}</div></div>
</section>
<aside><div class="box"><h2>ข้อมูลสมาชิก</h2>
<div class="kv"><span>ชื่อผู้ใช้</span><b>@${esc(u.username)}</b></div>
<div class="kv"><span>เป็นสมาชิกตั้งแต่</span><b>${thDate(u.created)}</b></div>
<div class="kv"><span>ความคิดเห็นทั้งหมด</span><b>${P.stats.comments}</b></div>
<div class="kv"><span>เกมที่ร่วมพูดคุย</span><b>${P.stats.games}</b></div>
<div class="kv"><span>เกมโปรด</span><b>${favs.length}/3</b></div></div></aside></div>`;
  const ein=$('#ein');
  if(ein){const max=editing==='name'?30:160,c=()=>$('#ecnt').textContent=`${[...ein.value].length}/${max}`;c();ein.oninput=c;ein.focus();ein.setSelectionRange(ein.value.length,ein.value.length);}
}

async function load(){
  let who=new URLSearchParams(location.search).get('u');
  if(!ADMIN){try{ME=(await api('/api/auth/me')).user;}catch(e){if(e.message==='401')return;}}
  renderAcct();
  if(!who&&ME)who=ME.username;
  if(!who){$('#main').innerHTML='<div class="err"><b>ไม่มีโปรไฟล์ให้แสดง</b>บัญชีผู้ดูแลไม่มีโปรไฟล์สมาชิก <a href="./" style="color:var(--ac)">กลับหน้าแรก</a></div>';return;}
  try{
    const [p,g]=await Promise.all([api('/api/users/'+encodeURIComponent(who)),api('/api/games?sort=score').catch(()=>({items:[]}))]);
    P=p;GAMES=g.items||[];
    P.user.favs=favGames(P.user.favs.map(x=>x.id)); // ใช้ข้อมูลเกมเต็ม (ยอดวิว คำอธิบาย) ให้การ์ดเหมือนหน้าแรก
    render();
  }catch(e){if(e.message!=='401')$('#main').innerHTML=`<div class="err"><b>${e.status===404?'ไม่พบสมาชิกนี้':'โหลดโปรไฟล์ไม่สำเร็จ'}</b><a href="./" style="color:var(--ac)">กลับหน้าแรก</a></div>`;}
}

/* ---------- บันทึกทีละจุด ---------- */
async function saveField(body,okMsg){
  try{
    const d=await api('/api/auth/profile',{method:'PUT',body:JSON.stringify(body)});
    ME=d.user;renderAcct();
    Object.assign(P.user,{name:d.user.name,bio:d.user.bio,avatar:d.user.avatar,banner:d.user.banner});
    P.user.favs=favGames(d.user.favs);
    editing=null;favDraft=null;render();toast(okMsg||'บันทึกแล้ว');return true;
  }catch(e){if(e.message!=='401')toast(e.message,true);return false;}
}

/* ---------- เมนูเล็กของดินสอ (รูปโปรไฟล์ / แบนเนอร์) ---------- */
function closePop(){const p=$('.pop');if(p)p.remove();}
function openPop(btn,what){
  closePop();
  const has=what==='avatar'?!!P.user.avatar:isImg(P.user.banner);
  if(!has){pick(what);return;} // ยังไม่มีรูป -> เลือกไฟล์ทันที
  const r=btn.getBoundingClientRect(),p=document.createElement('div');
  p.className='pop';
  p.innerHTML=`<button data-act="up">${I.up}${what==='avatar'?'อัปโหลดรูปใหม่':'อัปโหลดแบนเนอร์ใหม่'}</button><button data-act="rm">${I.undo}${what==='avatar'?'ใช้ตัวอักษรแรกของชื่อ':'ใช้สีของเว็บ'}</button>`;
  document.body.appendChild(p);
  const left=Math.min(r.left+scrollX,scrollX+innerWidth-p.offsetWidth-12);
  p.style.left=Math.max(12,left)+'px';p.style.top=(r.bottom+scrollY+8)+'px';
  p.onclick=e=>{const a=e.target.closest('[data-act]');if(!a)return;closePop();
    if(a.dataset.act==='up')pick(what);
    else saveField(what==='avatar'?{avatar:''}:{banner:'duffy'},what==='avatar'?'เปลี่ยนเป็นตัวอักษรแล้ว':'เปลี่ยนเป็นสีของเว็บแล้ว');};
}

document.addEventListener('click',e=>{
  if(!e.target.closest('.pop')&&!e.target.closest('[data-pen]'))closePop();
  const p=e.target.closest('[data-pen]');
  if(p){const w=p.dataset.pen;
    if(w==='avatar'||w==='banner'){openPop(p,w);return;}
    editing=w;if(w==='favs')favDraft=P.user.favs.map(g=>g.id);render();return;}
  if(e.target.closest('[data-x]')){editing=null;favDraft=null;render();return;}
  const ok=e.target.closest('[data-ok]');
  if(ok){const w=ok.dataset.ok;
    if(w==='favs'){saveField({favs:favDraft},'บันทึกเกมโปรดแล้ว');return;}
    const v=$('#ein').value;
    if(w==='name'&&!v.trim()){toast('กรุณาใส่ชื่อที่แสดง',true);$('#ein').focus();return;}
    ok.disabled=true;saveField({[w]:v},w==='name'?'เปลี่ยนชื่อแล้ว':'บันทึกแนะนำตัวแล้ว').then(s=>{if(!s)ok.disabled=false;});return;}
  const g=e.target.closest('[data-g]');
  if(g&&editing==='favs'){const id=+g.dataset.g;favDraft=favDraft.includes(id)?favDraft.filter(x=>x!==id):[...favDraft,id].slice(0,3);render();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('.pop'))closePop();else if(editing){editing=null;favDraft=null;render();}}
  if(e.key==='Enter'&&e.target.id==='ein'&&editing==='name'){e.preventDefault();$('[data-ok="name"]').click();}
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='ein'&&editing==='bio'){e.preventDefault();$('[data-ok="bio"]').click();}
});

/* ---------- อัปโหลดรูป: ย่อในเบราว์เซอร์ก่อน แล้วบันทึกทันที ---------- */
let picking='avatar';
function pick(k){picking=k;$('#file').click();}
$('#file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){toast('รองรับเฉพาะไฟล์ JPG, PNG, WebP หรือ GIF',true);return;}
  const kind=picking;busy=kind;render();toast(kind==='avatar'?'กำลังอัปโหลดรูปโปรไฟล์...':'กำลังอัปโหลดแบนเนอร์...');
  try{
    const blob=await shrink(f,kind);
    if(blob.size>3*1024*1024)throw new Error('ไฟล์ใหญ่เกิน 3 MB');
    const r=await fetch(API+'/api/auth/images',{method:'POST',headers:hdr(blob.type||'application/octet-stream'),body:blob});
    const d=await r.json().catch(()=>({}));
    if(r.status===401)return toLogin();
    if(!r.ok)throw new Error(d.error||r.status);
    busy=null;await saveField({[kind]:d.path},kind==='avatar'?'เปลี่ยนรูปโปรไฟล์แล้ว':'เปลี่ยนแบนเนอร์แล้ว');
  }catch(err){busy=null;render();toast('อัปโหลดไม่สำเร็จ: '+(err.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้':err.message),true);}
};
async function shrink(file,kind){
  if(file.type==='image/gif')return file;
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('เปิดไฟล์รูปนี้ไม่ได้'));i.src=url;});
    const c=document.createElement('canvas'),x=c.getContext('2d');
    if(kind==='avatar'){const s=Math.min(img.naturalWidth,img.naturalHeight),o=Math.min(400,s);c.width=c.height=o;x.drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,o,o);}
    else{const k=Math.min(1,1600/img.naturalWidth);c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);x.drawImage(img,0,0,c.width,c.height);}
    let b=await new Promise(r=>c.toBlob(r,'image/webp',.85));
    if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));
    return b;
  }finally{URL.revokeObjectURL(url);}
}

load();
