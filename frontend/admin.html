<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ผู้ดูแล | Duffy Review</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--sf:#fff;--tx:#14182b;--mu:#667085;--bd:#e3e6ef;--ac:#ff6a2b;--ac2:#7c4dff;--ok:#12a150;--er:#e5484d;--sh:0 4px 18px rgba(20,24,43,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--sf:#171b2e;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--sf:#171b2e;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',system-ui,'Noto Sans Thai',sans-serif;line-height:1.5}
a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
textarea{resize:vertical}
label{display:grid;gap:4px;font-size:13px;font-weight:500;color:var(--mu)}
label small{font-weight:400}
.btn{border:1px solid var(--bd);background:var(--sf);border-radius:10px;padding:8px 14px;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--mu)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:500}
.btn.pri:hover{filter:brightness(1.05)}
.btn.dan{color:var(--er)}.btn.dan:hover{border-color:var(--er)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.6;cursor:wait}
.logo{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;text-decoration:none}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.logo b{color:var(--ac)}
.hide{display:none!important}
.mu{color:var(--mu)}
.msg{font-size:13px;min-height:20px}.msg.er{color:var(--er)}.msg.ok{color:var(--ok)}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:16px}
.lbox{background:var(--sf);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--sh);padding:28px;width:100%;max-width:380px;display:grid;gap:14px}
.lbox h1{margin:0;font-size:22px}.lbox p{margin:-8px 0 0;font-size:14px}
.lbox .btn{padding:10px}

/* ---------- app ---------- */
header{position:sticky;top:0;z-index:20;background:var(--sf);border-bottom:1px solid var(--bd)}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar .sp{flex:1}
.who{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:4px}
.tab{background:none;border:0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu)}
.tab:hover,.tab.on{background:var(--bg);color:var(--tx)}
main{max-width:1180px;margin:auto;padding:20px 16px 48px}
.tool{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.tool h2{margin:0;font-size:20px;margin-right:auto}
.tool input{max-width:260px}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:14px;align-items:center;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px}
.th{width:96px;height:54px;border-radius:9px;overflow:hidden;position:relative;flex:none}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.row h3{margin:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12px;color:var(--mu);display:flex;gap:10px;flex-wrap:wrap}
.row .meta b{color:var(--ac)}
.row .acts{display:flex;gap:6px}
.row>div{min-width:0}
@media(max-width:600px){.row{grid-template-columns:72px 1fr}.th{width:72px;height:44px}.row .acts{grid-column:1/-1;justify-content:flex-end}}
.empty{text-align:center;padding:50px 10px;color:var(--mu)}
.cm{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.cm>div{flex:1;min-width:0}
.cm p{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:14px}
.cm .meta{font-size:12px;color:var(--mu)}
.cm .meta b{color:var(--tx)}

/* ---------- editor ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50;overflow:auto;padding:16px}
.modal.show{display:block}
.ed{background:var(--sf);border-radius:18px;max-width:860px;margin:3vh auto;box-shadow:var(--sh)}
.edh{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.edh h2{margin:0;font-size:18px;flex:1}
.edb{padding:18px 20px;display:grid;gap:14px}
.g2{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g2 .w2{grid-column:span 2}.g2 .w4{grid-column:1/-1}
@media(max-width:640px){.g2{grid-template-columns:1fr 1fr}}
.pv{height:170px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:700;font-size:18px}
.pv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv.drop{outline:3px dashed var(--ac);outline-offset:-6px}
.pv .hint{position:absolute;right:12px;bottom:12px;z-index:2;font-size:12px;font-weight:500;background:rgba(0,0,0,.55);padding:3px 9px;border-radius:8px}
.imgrow{display:flex;gap:8px}.imgrow input{flex:1;min-width:0}
.btn.up{background:var(--ac2);border-color:var(--ac2);color:#fff;font-weight:500}
.pv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.7))}
.pv span{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.pv .sc{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:10px;font-size:16px}
.pv .ag{position:absolute;top:10px;left:10px;background:#fff;color:#111;padding:1px 8px;border-radius:7px;font-size:12px;text-shadow:none}
input[type=range]{padding:0;accent-color:var(--ac)}
.edf{display:flex;gap:10px;align-items:center;padding:14px 20px;border-top:1px solid var(--bd);position:sticky;bottom:0;background:var(--sf);border-radius:0 0 18px 18px}
.edf .msg{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:var(--sh);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
/* ---------- ข่าวสาร ---------- */
.stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.stab{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500}
.stab.on{background:var(--tx);color:var(--sf);border-color:var(--tx)}
.stab b{margin-left:4px}
.nbulk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.nbulk label{display:flex;flex-direction:row;align-items:center;gap:6px;color:var(--tx);font-weight:500}
.nbulk input,.nrow input[type=checkbox],.srow input[type=checkbox]{width:auto;accent-color:var(--ac)}
.nrow{display:grid;grid-template-columns:auto 120px minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:10px}
.nrow.sel{border-color:var(--ac)}
.nth{position:relative;width:120px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;background:linear-gradient(135deg,var(--ac2),var(--ac));display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:4px}
.nth img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nrow a.t{font-weight:600;font-size:15px;line-height:1.35;display:block}
.nrow a.t:hover{color:var(--ac)}
.nrow .meta{font-size:12px;color:var(--mu);display:flex;gap:8px;flex-wrap:wrap;margin:3px 0}
.nrow .meta .why{color:var(--er)}
.nrow p{margin:2px 0 0;font-size:13px;color:var(--mu);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nrow .acts{display:flex;flex-direction:column;gap:6px}
@media(max-width:700px){.nrow{grid-template-columns:auto 84px minmax(0,1fr)}.nth{width:84px}.nrow .acts{grid-column:1/-1;flex-direction:row;justify-content:flex-end}}
.ncfg{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:16px;display:grid;gap:12px}
.ncfg h3{margin:0;font-size:16px}
.srow{display:grid;grid-template-columns:auto 140px minmax(0,1fr) 150px 80px auto auto;gap:8px;align-items:center}
.srow label{display:flex;flex-direction:row;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.srow input,.srow select{padding:7px 9px;font-size:13px}
.shead{font-size:12px;color:var(--mu);font-weight:600}
@media(max-width:900px){.srow{grid-template-columns:auto 1fr 1fr;}.srow .u{grid-column:1/-1}.shead{display:none}}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
</style>
</head>
<body>

<!-- ===== หน้าเข้าสู่ระบบ ===== -->
<section id="login" class="hide">
<form class="lbox" id="lform" autocomplete="on">
<a class="logo" href="./"><i>D</i><span>Duffy <b>Review</b></span></a>
<h1>เข้าสู่ระบบผู้ดูแล</h1>
<p class="mu">สำหรับเพิ่มและแก้ไขรีวิวเกม</p>
<label>ชื่อผู้ใช้<input id="lu" name="username" autocomplete="username" required></label>
<label>รหัสผ่าน<input id="lp" name="password" type="password" autocomplete="current-password" required></label>
<button class="btn pri" id="lbtn">เข้าสู่ระบบ</button>
<div class="msg er" id="lmsg"></div>
</form>
</section>

<!-- ===== หน้าจัดการ ===== -->
<div id="app" class="hide">
<header><div class="bar">
<a class="logo" href="./" title="ไปหน้าเว็บ"><i>D</i><span>Duffy <b>Review</b></span></a>
<nav class="tabs"><button class="tab on" data-tab="games">รีวิวเกม</button><button class="tab" data-tab="comments">ความคิดเห็น</button><button class="tab" data-tab="users">สมาชิก</button><button class="tab" data-tab="news">ข่าวสาร <span id="npend"></span></button></nav>
<span class="sp"></span>
<span class="who" id="who"></span>
<a class="btn sm" href="./" target="_blank" rel="noopener">ดูหน้าเว็บ</a>
<button class="btn sm" id="logout">ออกจากระบบ</button>
</div></header>
<main>
<section id="tab-games">
<div class="tool"><h2>รีวิวเกมทั้งหมด <small class="mu" id="gcount"></small></h2><input id="gq" type="search" placeholder="ค้นหาชื่อเกม / หมวด..."><button class="btn pri" id="add">+ เพิ่มรีวิวใหม่</button></div>
<div class="list" id="glist"></div>
</section>
<section id="tab-comments" class="hide">
<div class="tool"><h2>ความคิดเห็นล่าสุด <small class="mu" id="ccount"></small></h2><input id="cq" type="search" placeholder="ค้นหาข้อความ / ชื่อ / เกม..."></div>
<div class="list" id="clist"></div>
</section>
<section id="tab-users" class="hide">
<div class="tool"><h2>สมาชิกทั้งหมด <small class="mu" id="ucount"></small></h2><input id="uq" type="search" placeholder="ค้นหาชื่อผู้ใช้ / ชื่อที่แสดง..."></div>
<div class="list" id="ulist"></div>
</section>
<section id="tab-news" class="hide">
<div class="tool"><h2>ข่าวสาร</h2><span class="mu" id="nlast" style="font-size:13px"></span><button class="btn" id="ncfgBtn">ตั้งค่าแหล่งข่าว / คำต้องห้าม</button><button class="btn pri" id="nfetch">ดึงข่าวตอนนี้</button></div>
<div class="ncfg hide" id="ncfg"></div>
<div class="stabs" id="nst"></div>
<div class="nbulk" id="nbulk"><label><input type="checkbox" id="nall"> เลือกทั้งหมด</label><span class="mu" id="nsel"></span><span class="sp" style="flex:1"></span><button class="btn sm ok" data-bulk="approved">อนุมัติที่เลือก</button><button class="btn sm dan" data-bulk="rejected">ไม่อนุมัติที่เลือก</button></div>
<div class="list" id="nlist"></div>
</section>
</main>
</div>

<!-- ===== ฟอร์มเพิ่ม/แก้ไข ===== -->
<div class="modal" id="md"><form class="ed" id="ef" novalidate>
<div class="edh"><h2 id="etitle">เพิ่มรีวิวใหม่</h2><button type="button" class="btn sm" data-close>ปิด</button></div>
<div class="edb">
<div class="pv" id="pv"></div>
<div class="g2">
<label class="w2">ชื่อเกม *<input name="title" maxlength="200" required></label>
<label>หมวดหมู่ *<input name="category" maxlength="50" list="cats" required></label>
<label>เรตอายุ *<select name="age"><option value="3">3+ ทุกวัย</option><option value="7">7+</option><option value="12">12+</option><option value="16">16+</option><option value="18">18+</option></select></label>
<label>คะแนนทีมงาน (0–10) *<input name="score" type="number" min="0" max="10" step="0.1" required></label>
<label>วันที่ลงรีวิว<input name="date" type="date"></label>
<label>แพลตฟอร์ม<input name="platforms" maxlength="200" placeholder="PS5 · PC"></label>
<label>ยอดวิวตั้งต้น<input name="views" type="number" min="0" step="1"></label>
<div class="w4" style="display:grid;gap:4px"><label for="f-image">รูปปก <small>กดอัปโหลด หรือลากไฟล์รูปมาวางบนภาพตัวอย่างด้านบน (แนะนำ 16:9) / ใส่ลิงก์ https://... ก็ได้</small></label>
<div class="imgrow"><input id="f-image" name="image" maxlength="500" placeholder="อัปโหลดรูป หรือวางลิงก์รูป"><button type="button" class="btn up" id="upbtn">อัปโหลดรูป</button></div>
<input type="file" id="upfile" accept="image/jpeg,image/png,image/webp,image/gif" hidden><span class="msg" id="upmsg"></span></div>
<label class="w4">ลิงก์ดูราคา / เว็บเกม <small>เช่น หน้า Steam ของเกม หรือเว็บทางการ (เว้นว่าง = ปุ่มค้นหาชื่อเกมบน Steam)</small><input name="link" type="url" maxlength="500" placeholder="https://store.steampowered.com/app/..."></label>
<label class="w4">สีพื้นหลังสำรอง (เมื่อไม่มีรูป)<input name="hue" type="range" min="0" max="360"></label>
<label class="w4">คำอธิบายสั้น (บนการ์ด)<input name="desc" maxlength="1000"></label>
<label class="w4">เนื้อรีวิวเต็ม <small>เว้นบรรทัดว่างเพื่อขึ้นย่อหน้าใหม่</small><textarea name="review" rows="9"></textarea></label>
<label class="w2">จุดเด่น <small>บรรทัดละ 1 ข้อ</small><textarea name="pros" rows="4"></textarea></label>
<label class="w2">จุดด้อย <small>บรรทัดละ 1 ข้อ</small><textarea name="cons" rows="4"></textarea></label>
</div>
</div>
<div class="edf"><span class="msg" id="emsg"></span><button type="button" class="btn" data-close>ยกเลิก</button><button class="btn pri" id="esave">บันทึก</button></div>
</form></div>
<datalist id="cats"></datalist>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const KEY="duffy-admin";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgUrl=s=>/^\/api\/images\/\d+$/.test(s)?API+s:/%[0-9a-f]{2}/i.test(s)?s:encodeURI(s); // รูปที่อัปโหลดอยู่บนเซิร์ฟเวอร์ Render
const bg=h=>`linear-gradient(135deg,hsl(${h},70%,45%),hsl(${(+h+60)%360},65%,30%))`;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
let session=null,games=[],comments=[],editing=null,dirty=false;
try{session=JSON.parse(localStorage.getItem(KEY)||"null")}catch(_){}

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600);}
function save(s){session=s;try{s?localStorage.setItem(KEY,JSON.stringify(s)):localStorage.removeItem(KEY)}catch(_){}}

// เรียก API พร้อมโทเคน ถ้าโทเคนหมดอายุจะเด้งกลับหน้าเข้าสู่ระบบ
async function api(path,opt={}){
  const h={'Content-Type':'application/json'};if(session)h.Authorization='Bearer '+session.token;
  const r=await fetch(API+path,{...opt,headers:h,body:opt.body&&JSON.stringify(opt.body)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&!path.endsWith('/login')){save(null);show('login');$('#lmsg').textContent='เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';throw new Error('unauthorized');}
  if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
  return d;
}

function show(v){$('#login').classList.toggle('hide',v!=='login');$('#app').classList.toggle('hide',v!=='app');if(v==='login')setTimeout(()=>$('#lu').focus(),0);}

// ---------- login / logout ----------
$('#lform').onsubmit=async e=>{
  e.preventDefault();const b=$('#lbtn'),m=$('#lmsg');b.disabled=true;m.textContent='';
  try{const d=await api('/api/admin/login',{method:'POST',body:{username:$('#lu').value.trim(),password:$('#lp').value}});
    save({token:d.token,user:d.user});$('#lp').value='';start();}
  catch(err){m.textContent=err.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (ตรวจสอบ config.js)':err.message;}
  finally{b.disabled=false;}
};
$('#logout').onclick=async()=>{
  if(dirty&&!confirm('มีการแก้ไขที่ยังไม่บันทึก ออกจากระบบเลยหรือไม่?'))return;
  try{await api('/api/admin/logout',{method:'POST'})}catch(_){}
  save(null);closeEd(true);games=[];comments=[];show('login');$('#lmsg').textContent='';toast('ออกจากระบบแล้ว');
};

async function start(){
  show('app');$('#who').textContent='ผู้ใช้: '+session.user;
  await Promise.all([loadGames(),loadComments()]).catch(()=>{});
  api('/api/admin/news?status=pending').then(d=>{$('#npend').textContent=d.counts.pending?`(${d.counts.pending})`:'';}).catch(()=>{});
}

// ---------- tabs ----------
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  $('#tab-games').classList.toggle('hide',t.dataset.tab!=='games');
  $('#tab-comments').classList.toggle('hide',t.dataset.tab!=='comments');
  $('#tab-users').classList.toggle('hide',t.dataset.tab!=='users');
  $('#tab-news').classList.toggle('hide',t.dataset.tab!=='news');
  if(t.dataset.tab==='comments')loadComments().catch(()=>{});
  if(t.dataset.tab==='users')loadUsers();
  if(t.dataset.tab==='news')loadNews();
});

// ---------- games ----------
async function loadGames(){
  $('#glist').innerHTML='<div class="empty">กำลังโหลด...</div>';
  try{games=await api('/api/admin/games');renderGames();
    $('#cats').innerHTML=[...new Set(games.map(g=>g.category))].map(c=>`<option value="${esc(c)}">`).join('');}
  catch(e){if(e.message!=='unauthorized')$('#glist').innerHTML=`<div class="empty">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;}
}
function renderGames(){
  const q=$('#gq').value.trim().toLowerCase();
  const a=games.filter(g=>!q||`${g.title} ${g.category} ${g.platforms}`.toLowerCase().includes(q));

// ---------- อัปโหลดรูป: ย่อในเบราว์เซอร์ก่อน (กว้างไม่เกิน 1280px) แล้วส่งไปเก็บบนเซิร์ฟเวอร์ ----------
const MAXW=1280;
async function shrink(file){
  if(file.type==='image/gif')return file; // เก็บภาพเคลื่อนไหวไว้ตามเดิม
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('เปิดไฟล์รูปนี้ไม่ได้'));i.src=url;});
    const s=Math.min(1,MAXW/img.naturalWidth),w=Math.round(img.naturalWidth*s),h=Math.round(img.naturalHeight*s);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
    let b=await new Promise(r=>c.toBlob(r,'image/webp',0.85));
    if(!b||b.type!=='image/webp')b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));
    return b.size<file.size||s<1?b:file; // ไม่ทำให้ไฟล์เล็กอยู่แล้วใหญ่ขึ้น
  }finally{URL.revokeObjectURL(url);}
}
async function uploadImage(file){
  const m=$('#upmsg'),b=$('#upbtn');
  if(!file)return;
  if(!/^image\/(jpeg|png|webp|gif)$/.test(file.type)){m.className='msg er';m.textContent='รองรับเฉพาะไฟล์ JPG, PNG, WebP หรือ GIF';return;}
  b.disabled=true;m.className='msg';m.textContent='กำลังย่อรูป...';
  try{
    const blob=await shrink(file);
    if(blob.size>3*1024*1024)throw new Error('ไฟล์ใหญ่เกิน 3 MB');
    m.textContent=`กำลังอัปโหลด (${Math.ceil(blob.size/1024)} KB)...`;
    const r=await fetch(API+'/api/admin/images',{method:'POST',headers:{'Content-Type':blob.type||'application/octet-stream',Authorization:'Bearer '+session.token},body:blob});
    const d=await r.json().catch(()=>({}));
    if(r.status===401){closeEd(true);save(null);show('login');$('#lmsg').textContent='เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่';return;}
    if(!r.ok)throw new Error(d.error||('HTTP '+r.status));
    F('image').value=d.path;dirty=true;preview();
    m.className='msg ok';m.textContent=`อัปโหลดแล้ว (${Math.ceil(d.size/1024)} KB) อย่าลืมกด "บันทึก"`;
  }catch(e){m.className='msg er';m.textContent='อัปโหลดไม่สำเร็จ: '+(e.message==='Failed to fetch'?'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้':e.message);}
  finally{b.disabled=false;$('#upfile').value='';}
}
$('#upbtn').onclick=()=>$('#upfile').click();
$('#upfile').onchange=e=>uploadImage(e.target.files[0]);

pv.ondragover=e=>{e.preventDefault();pv.classList.add('drop');};

const NST=[['pending','รอตรวจ'],['approved','ขึ้นเว็บแล้ว'],['rejected','ไม่อนุมัติ'],['filtered','ถูกกรองอัตโนมัติ']];
const CATN={game:'เกม',tech:'ไอทีและดิจิทัล',hw:'ฮาร์ดแวร์คอมพิวเตอร์'};
let nst='pending',nitems=[],nsel=new Set();
const ago=d=>{const s=(Date.now()-new Date(d))/1000;if(s<60)return 'เมื่อสักครู่';if(s<3600)return Math.floor(s/60)+' นาทีที่แล้ว';if(s<86400)return Math.floor(s/3600)+' ชั่วโมงที่แล้ว';return Math.floor(s/86400)+' วันที่แล้ว';};
async function loadNews(){
  $('#nlist').innerHTML='<div class="empty">กำลังโหลด...</div>';
  try{const d=await api('/api/admin/news?status='+nst);nitems=d.items;nsel=new Set();
    $('#nst').innerHTML=NST.map(([k,l])=>`<button class="stab ${k===nst?'on':''}" data-st="${k}">${l}<b>${d.counts[k]||0}</b></button>`).join('');
    $('#npend').textContent=d.counts.pending?`(${d.counts.pending})`:'';
    $('#nlast').textContent=d.running?'กำลังดึงข่าว...':d.lastRun?`ดึงล่าสุด ${ago(d.lastRun.at)}`:'ยังไม่ได้ดึงข่าวตั้งแต่เซิร์ฟเวอร์เริ่ม';
    renderNews();}
  catch(e){if(e.message!=='unauthorized')$('#nlist').innerHTML=`<div class="empty">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;}
}
function renderNews(){
  $('#nbulk').classList.toggle('hide',!nitems.length||nst==='approved');
  $('#nall').checked=nitems.length&&nsel.size===nitems.length;$('#nsel').textContent=nsel.size?`เลือกแล้ว ${nsel.size} ข่าว`:'';
  const acts=n=>nst==='pending'?`<button class="btn sm ok" data-ns="approved" data-id="${n.id}">อนุมัติ</button><button class="btn sm dan" data-ns="rejected" data-id="${n.id}">ไม่อนุมัติ</button>`
    :nst==='approved'?`<button class="btn sm dan" data-ns="rejected" data-id="${n.id}">เอาลงจากเว็บ</button>`
    :`<button class="btn sm ok" data-ns="approved" data-id="${n.id}">อนุมัติ</button><button class="btn sm" data-ns="pending" data-id="${n.id}">กลับไปรอตรวจ</button>`;
  $('#nlist').innerHTML=nitems.length?nitems.map(n=>`<div class="nrow ${nsel.has(n.id)?'sel':''}">${nst==='approved'?'<span></span>':`<input type="checkbox" data-pick="${n.id}" ${nsel.has(n.id)?'checked':''} aria-label="เลือกข่าวนี้">`}
<div class="nth">${esc(n.sourceName)}${n.image?`<img src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>
<div><a class="t" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer">${esc(n.title)}</a><div class="meta"><b>${esc(n.sourceName)}</b><span>${esc(n.catName)}</span><span>${ago(n.published)}</span>${n.lang==='en'?'<span>ภาษาอังกฤษ</span>':''}${n.reason?`<span class="why">${esc(n.reason)}</span>`:''}</div><p>${esc(n.summary)}</p></div>
<div class="acts">${acts(n)}</div></div>`).join(''):`<div class="empty">${nst==='pending'?'ไม่มีข่าวรอตรวจ กด "ดึงข่าวตอนนี้" เพื่อดึงข่าวใหม่':'ไม่มีข่าวในหมวดนี้'}</div>`;

  if(e.target.id==='scancel'){$('#ncfg').classList.add('hide');return;}
  if(e.target.id==='ssave'){const b=e.target;b.disabled=true;
    try{const d=await api('/api/admin/news/config',{method:'PUT',body:{sources:readRows(),block:$('#nblock').value}});ncfg={...ncfg,...d};paintCfg();toast('บันทึกการตั้งค่าข่าวแล้ว');}
    catch(err){if(err.message!=='unauthorized')alert(err.message);}finally{b.disabled=false;}}
};

document.onkeydown=e=>{if(e.key==='Escape'&&$('#md').classList.contains('show'))closeEd();};
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});

// เริ่มต้น: ถ้ามีโทเคนอยู่แล้วให้ตรวจว่ายังใช้ได้
(async()=>{
  if(!session)return show('login');
  try{const d=await api('/api/admin/me');session.user=d.user;start();}
  catch(e){if(e.message!=='unauthorized'){show('login');$('#lmsg').textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ('+e.message+')';}}
})();
</script>
</body>
</html>
