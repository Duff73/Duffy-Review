<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duffy Review | รีวิวเกม คะแนน และความคุ้มค่าก่อนซื้อ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>/* ยังไม่ได้เข้าสู่ระบบ -> ไปหน้าเข้าสู่ระบบทันที (ก่อนหน้าเว็บแสดง) */try{if(!localStorage.getItem('duffy-member')&&!localStorage.getItem('duffy-admin'))location.replace('login.html?next='+encodeURIComponent(location.pathname+location.hash));}catch(_){}</script>
<script>/* โหมดสว่าง/มืดที่เคยเลือกไว้ */try{const t=localStorage.getItem('duffy-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,400;0,500;0,600;0,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
</head>
<body>

<header><div class="wrap bar">
  <button class="logo" data-home aria-label="หน้าแรก Duffy Review"><img class="wm-ic" src="duffy-pixel.svg" alt="" width="40" height="40"><span class="wm2"><span class="wm2-a">DUFFY</span><span class="wm2-b">REVIEW</span></span></button>
  <nav class="nav" aria-label="เมนูหลัก">
    <button class="nb on" id="homeBtn" data-home>หน้าแรก</button>
    <a class="nb" href="news.html">ข่าวสาร</a>
    <div class="dd" data-k="cat"><button class="nb" aria-haspopup="true">หมวดหมู่เกม<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button><div class="dm"></div></div>
    <div class="dd" data-k="age"><button class="nb" aria-haspopup="true">หมวดหมู่อายุ<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button><div class="dm"></div></div>
  </nav>
  <span class="sp"></span>
  <div class="sr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ค้นหารีวิวเกม..." autocomplete="off" aria-label="ค้นหารีวิวเกม"><kbd>/</kbd></div>
  <button class="ib" id="theme" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด"></button>
  <div class="acct" id="acct"></div>
</div></header>

<main class="wrap">
  <section class="hero" id="hero" aria-label="รีวิวเด่น"><div class="hin" id="hin"></div></section>
  <div class="tools"><div class="chips" id="chips"></div>
    <div class="seg" id="seg" role="tablist" aria-label="เรียงตาม"></div></div>
  <div class="layout">
    <section>
      <div class="info"><h2 id="ttl">รีวิวล่าสุด</h2><span><span class="cnt" id="cnt"></span><button class="clear" id="clr" data-home hidden>ล้างตัวกรอง</button></span></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside>
      <div class="box"><h2><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>Top 10 คะแนนสูงสุด</h2><div id="top"></div></div>
      <div class="box"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>หมวดหมู่</h2><div class="cats" id="cats"></div></div>
      <div class="box" id="newsBox" hidden><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5"/></svg>ข่าวล่าสุด</h2><div id="newsList"></div><p class="nnote">ข่าวและภาพเป็นลิขสิทธิ์ของแหล่งข่าวต้นทาง กดเพื่ออ่านฉบับเต็ม</p><a class="nmore" href="news.html">ดูข่าวทั้งหมด</a></div>
    </aside>
  </div>
</main>
<footer>© 2026 Duffy Review</footer>

<div class="modal" id="md" role="dialog" aria-modal="true" aria-label="รีวิวเกม"><div class="mb" id="mb"></div></div>

<script src="config.js"></script>
<script>
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgUrl=s=>/^\/api\/images\/\d+$/.test(s)?API+s:/%[0-9a-f]{2}/i.test(s)?s:encodeURI(s); // รูปที่อัปโหลดผ่าน admin อยู่บนเซิร์ฟเวอร์ Render
const fillBg=g=>`linear-gradient(135deg,hsl(${g.hue??200},70%,45%),hsl(${((g.hue??200)+60)%360},65%,30%))`;
const art=(g,lazy=true)=>`<div class="fill" style="background:${fillBg(g)}"></div>${g.image?`<img src="${esc(imgUrl(g.image))}" alt="" ${lazy?'loading="lazy"':''} onerror="this.remove()">`:''}`;
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const thDate=d=>{try{return new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(_){return d}};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const ring=s=>`<span class="ring" style="--v:${Math.max(0,Math.min(100,s*10))}"><b>${s}</b></span>`;
if('scrollRestoration' in history)history.scrollRestoration='manual';

/* ---------- ไอคอน (SVG ไม่ใช้อิโมจิ) ---------- */
const I={
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 13.5h.01"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};

/* ---------- โหมดสว่าง/มืด ---------- */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
function paintTheme(){$('#theme').innerHTML=isDark()?I.sun:I.moon;}
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('duffy-theme',t)}catch(_){}paintTheme();};
paintTheme();

/* ---------- ปุ่มดูราคา: ลิงก์ที่ admin ใส่ไว้ หรือค้นหาบน Steam ---------- */
const STORES={'store.steampowered.com':'Steam','steampowered.com':'Steam','store.epicgames.com':'Epic Games Store','epicgames.com':'Epic Games Store','store.playstation.com':'PlayStation Store','playstation.com':'PlayStation Store','xbox.com':'Xbox Store','nintendo.com':'Nintendo eShop','gog.com':'GOG','play.google.com':'Google Play','apps.apple.com':'App Store','ea.com':'EA','ubisoft.com':'Ubisoft Store'};
function storeInfo(g){
  if(/^https?:\/\//i.test(g.link||'')){
    let host='';try{host=new URL(g.link).hostname.replace(/^www\./,'')}catch(_){}
    const d=Object.keys(STORES).find(k=>host===k||host.endsWith('.'+k));
    return {href:g.link,label:d?'ดูราคาบน '+STORES[d]:'ไปหน้าเว็บเกม',note:host};
  }
  return {href:'https://store.steampowered.com/search/?term='+encodeURIComponent(g.title),label:'ค้นหาราคาบน Steam',note:'ค้นหาชื่อเกมนี้บน Steam'};
}
const storeBtn=(g,cls)=>{const s=storeInfo(g);return `<a class="btn ${cls}" href="${esc(s.href)}" target="_blank" rel="noopener noreferrer" title="${esc(s.note)}">${I.ext}${esc(s.label)}</a>`;};

/* ---------- ข้อมูล ---------- */
const SORTS=[["new","ใหม่ล่าสุด","รีวิวล่าสุด"],["pop","ยอดนิยม","ยอดนิยมสุด"],["score","คะแนนสูงสุด","คะแนนสูงสุด"]];
const S={q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"};
let ALL=[],CATS=[],AGES=[],NEW_IDS=new Set(),cur=null,stale=false;
const byScore=(a,b)=>b.score-a.score||b.views-a.views;
const byNew=(a,b)=>String(b.date).localeCompare(String(a.date))||b.id-a.id;
const byPop=(a,b)=>b.views-a.views||b.score-a.score;
async function api(p){const r=await fetch(API+p,{headers:hdr()});if(r.status===401){toLogin();throw new Error(401);}if(!r.ok)throw new Error(r.status);return r.json();}

async function loadAll(){
  try{
    const r=await api('/api/games?sort=new');
    ALL=r.items||[];
    const n={};ALL.forEach(g=>{n[g.category]=(n[g.category]||0)+1;});
    CATS=Object.keys(n).sort((a,b)=>n[b]-n[a]).map(c=>[c,n[c]]);
    AGES=[...new Set(ALL.map(g=>g.age))].sort((a,b)=>a-b);
    NEW_IDS=new Set([...ALL].sort(byNew).slice(0,3).map(g=>g.id));
    buildHero();render();
  }catch(e){
    if(String(e.message)==='401')return;
    $('#hin').innerHTML='<div><h1>Duffy Review</h1><p class="site">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ เซิร์ฟเวอร์ฟรีอาจกำลังตื่น ลองรีเฟรชอีกครั้งในอีกสักครู่</p></div>';
    $('#grid').innerHTML='<div class="empty"><b>โหลดรีวิวไม่สำเร็จ</b>ลองรีเฟรชหน้านี้อีกครั้ง</div>';
  }
}

/* ---------- การ์ดเกม (แบบเว็บเดิม) ---------- */
const card=g=>`<article class="card">
<div class="cv" data-i="${g.id}">${art(g)}<span class="age">${g.age}+</span>${NEW_IDS.has(g.id)?'<span class="nw">ใหม่</span>':''}${ring(g.score)}</div>
<div class="cb"><span class="tag">${esc(g.category)}</span><h3><button data-i="${g.id}">${esc(g.title)}</button></h3><p>${esc(g.desc)}</p>
<div class="mt"><span>${I.eye}<b class="vw" data-vw="${g.id}">${fmt(g.views)}</b></span><span>${I.chat}${g.commentCount}</span>${g.platforms?`<span class="pf" title="${esc(g.platforms)}">${I.pad}<i>${esc(g.platforms)}</i></span>`:''}</div>
<div class="act"><button class="b1" data-i="${g.id}">อ่านรีวิว</button><button data-i="${g.id}" data-j="1">ความคิดเห็น (${g.commentCount})</button></div></div></article>`;

function filtered(){
  const q=S.q.trim().toLowerCase();
  return ALL.filter(g=>(S.cat==='ทั้งหมด'||g.category===S.cat)&&(S.age==='ทั้งหมด'||String(g.age)===String(S.age))
    &&(!q||`${g.title} ${g.category} ${g.desc} ${g.platforms}`.toLowerCase().includes(q)))
    .sort(S.sort==='pop'?byPop:S.sort==='score'?byScore:byNew);
}
const isFiltered=()=>!!S.q.trim()||S.cat!=='ทั้งหมด'||S.age!=='ทั้งหมด';
function render(){
  const f=isFiltered(),q=S.q.trim();
  $('#homeBtn').classList.toggle('on',!f&&S.sort==='new');
  document.querySelectorAll('.dd').forEach(el=>el.querySelector('.nb').classList.toggle('on',String(S[el.dataset.k])!=='ทั้งหมด'));
  $('#clr').hidden=!f;
  $('#hero').hidden=!!q;
  dd();
  $('#chips').innerHTML=[['ทั้งหมด',ALL.length],...CATS].map(([c,n])=>`<button class="chip ${S.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`).join('');
  $('#seg').innerHTML=SORTS.map(([v,l])=>`<button role="tab" aria-selected="${S.sort===v}" class="${S.sort===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  $('#cats').innerHTML=CATS.map(([c,n])=>`<button class="${S.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`).join('');
  if(!ALL.length)return;
  const list=filtered(),sl=SORTS.find(s=>s[0]===S.sort)[2];
  $('#ttl').textContent=q?`ผลการค้นหา “${q}”`:S.cat!=='ทั้งหมด'?`รีวิวหมวด${S.cat}`:S.age!=='ทั้งหมด'?`เกมเรต ${S.age}+`:sl;
  $('#cnt').textContent=list.length+' รายการ';
  $('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><b>ไม่พบรีวิวที่ตรงกับการค้นหา</b>ลองใช้คำอื่น หรือล้างตัวกรอง</div>';
  $('#top').innerHTML=[...ALL].sort(byScore).slice(0,10).map((g,i)=>`<button class="tp" data-i="${g.id}"><span class="rk">${i+1}</span><span class="th">${art(g)}</span><span class="n"><span>${esc(g.title)}</span><small>${esc(g.category)}</small></span><b>${g.score}</b></button>`).join('');
  stale=false;
}

/* ---------- แบนเนอร์: รีวิวเด่น 4 เกมคะแนนสูงสุด ---------- */
let HERO=[],hi=0,htimer=null;
function buildHero(){HERO=[...ALL].sort((a,b)=>(!!b.image-!!a.image)||byScore(a,b)).slice(0,4);setHero(0);}
function setHero(i){
  if(!HERO.length){$('#hin').innerHTML='<div><h1>Duffy Review</h1><p class="site">รีวิวเกมตรงไปตรงมา พร้อมคะแนนและความคุ้มค่าก่อนซื้อ</p></div>';return;}
  hi=(i+HERO.length)%HERO.length;const g=HERO[hi];
  $('#hin').innerHTML=`<div>
<div class="kick"><i>D</i>รีวิวเด่นจาก Duffy Review</div>
<h1>${esc(g.title)}</h1>
<p class="site">รีวิวเกมตรงไปตรงมา พร้อมคะแนนและความคุ้มค่าก่อนซื้อ</p>
<div class="hmeta">${ring(g.score)}<span class="pill">${g.age}+</span><span class="pill">${esc(g.category)}</span>${g.platforms?`<span>${esc(g.platforms)}</span>`:''}</div>
<p class="d">${esc(g.desc||'')}</p>
<div class="hbtns"><button class="btn w" data-i="${g.id}">${I.book}อ่านรีวิว</button>${storeBtn(g,'o')}</div></div>
<div class="feat"><div class="fimg in" data-i="${g.id}" role="button" aria-label="อ่านรีวิว ${esc(g.title)}" style="cursor:pointer">${art(g,false)}</div>
${HERO.length>1?`<div class="thumbs">${HERO.map((x,j)=>`<button data-hero="${j}" class="${j===hi?'on':''}" aria-label="แสดง ${esc(x.title)}">${art(x)}</button>`).join('')}</div>`:''}</div>`;
  clearInterval(htimer);
  if(HERO.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
    htimer=setInterval(()=>{if(!document.hidden&&!$('#md').classList.contains('show')&&!$('#hero').hidden&&!$('#hero').matches(':hover'))setHero(hi+1);},9000);
}

/* ---------- เมนูหมวด / อายุ ---------- */
function opts(k){
  if(k==='cat')return [['ทั้งหมด','ทุกหมวด',ALL.length],...CATS.map(([c,n])=>[c,c,n])];
  return [['ทั้งหมด','ทุกช่วงอายุ'],...AGES.map(a=>[String(a),a<=3?'3+ ทุกวัย':a+'+'])];
}
function dd(){document.querySelectorAll('.dd').forEach(el=>{const k=el.dataset.k;
  el.querySelector('.dm').innerHTML=opts(k).map(([v,l,n])=>`<button data-v="${esc(v)}" class="${String(S[k])===String(v)?'on':''}">${esc(l)}${n!=null?`<small>${n}</small>`:''}</button>`).join('');});}
document.querySelectorAll('.dd').forEach(el=>{
  el.querySelector('.nb').onclick=e=>{e.stopPropagation();const o=el.classList.contains('open');closeDD();
    if(!o){el.classList.add('open');if(innerWidth<=900)el.querySelector('.dm').style.top=$('header').getBoundingClientRect().bottom+6+'px';}};
  el.querySelector('.dm').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;e.stopPropagation();S[el.dataset.k]=b.dataset.v;closeDD();render();toList();};
});
const closeDD=()=>document.querySelectorAll('.dd').forEach(x=>{x.classList.remove('open');x.querySelector('.dm').style.top='';});
const toList=()=>{const t=$('.tools').getBoundingClientRect().top+scrollY-80;if(scrollY>t)scrollTo({top:t,behavior:'smooth'});};

/* ---------- ค้นหา ---------- */
let qt;
$('#q').oninput=e=>{S.q=e.target.value;clearTimeout(qt);qt=setTimeout(render,200);};
function reset(){Object.assign(S,{q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"});$('#q').value='';render();scrollTo({top:0,behavior:'smooth'});}

/* ---------- หน้ารีวิว ---------- */
const sumHtml=g=>`คะแนนรวม <b>${g.score}</b>/10 · ทีมงาน ${g.editorScore} · ผู้อ่าน ${g.readerVotes?`★ ${g.readerRating} (${g.readerVotes} โหวต)`:'ยังไม่มีโหวต'}`;
function detail(g){
  const paras=(g.review||g.desc||'').split(/\n\n/).map(p=>`<p>${esc(p)}</p>`).join('');
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const sim=ALL.filter(x=>x.category===g.category&&x.id!==g.id).sort(byScore).slice(0,4);
  return `<button class="x" data-close aria-label="ปิด">${I.x}</button>
<div class="mcv">${art(g,false)}<span class="age">${g.age}+</span></div>
<div class="mbody">
<div class="mtop"><span id="mring">${ring(g.score)}</span><div><h2>${esc(g.title)}</h2><div class="sub">รีวิวโดย Duffy Review · ${thDate(g.date)}</div></div></div>
<div class="facts"><span><b>${esc(g.category)}</b></span>${g.platforms?`<span>${I.pad}<b>${esc(g.platforms)}</b></span>`:''}<span>${I.eye}<b class="vw" data-vw="${g.id}">${fmt(g.views)}</b> ครั้ง</span><span>${I.cal}${thDate(g.date)}</span></div>
<div class="mbtns">${storeBtn(g,'a')}<a class="btn g" href="#cm" data-jump>${I.chat}ไปที่ความคิดเห็น</a></div>
<div class="rv">${paras}</div>
<div class="pc"><div><h4>จุดเด่น</h4><ul>${li(g.pros)}</ul></div><div><h4>จุดด้อย</h4><ul>${li(g.cons)}</ul></div></div>
<div class="rate"><div id="rsum">${sumHtml(g)}</div><div class="rstars" id="rstars">${[1,2,3,4,5].map(n=>`<button class="rb ${n<=(g.myRating||0)?'on':''}" data-r="${n}" aria-label="${n} ดาว">★</button>`).join('')}</div><small id="rmsg" class="mu">${g.myRating?`คะแนนของคุณ: ${g.myRating} ดาว (กดดาวอื่นเพื่อเปลี่ยน)`:'กดดาวเพื่อให้คะแนนเกมนี้'}</small></div>
<h3 class="sec-h" id="cm">ความคิดเห็น (<span id="ccount">${g.commentCount}</span>)</h3>
<div id="cfw">${cform()}</div>
<div id="clist"></div>
${sim.length?`<h3 class="sec-h">รีวิวหมวด${esc(g.category)}อื่นๆ</h3><div class="sim">${sim.map(x=>`<button class="mini" data-i="${x.id}"><div class="cv">${art(x)}<span class="age">${x.age}+</span>${ring(x.score)}</div><span>${esc(x.title)}</span></button>`).join('')}</div>`:''}
</div>`;}
async function loadComments(id){
  try{const r=await api(`/api/games/${id}/comments`);
    const prof=c=>c.username?`profile.html?u=${encodeURIComponent(c.username)}`:'';
    $('#clist').innerHTML=r.length?r.map(c=>`<div class="cmt">${prof(c)?`<a href="${prof(c)}" title="ดูโปรไฟล์ ${esc(c.name)}">`:''}<span class="av${c.userId?'':' g'}"${c.accent?` style="--c:${esc(c.accent)}"`:''}>${esc(([...String(c.name)][0]||'?').toUpperCase())}${c.avatar?`<img src="${esc(imgUrl(c.avatar))}" alt="" loading="lazy">`:''}</span>${prof(c)?'</a>':''}<div>${prof(c)?`<a class="nm" href="${prof(c)}">${esc(c.name)}</a>`:`<b>${esc(c.name)}</b>`}${c.userId?'<span class="badge">สมาชิก</span>':''} <small>${thDate(c.date)}</small>${c.rating?` <small>${stars(c.rating)}</small>`:''}${ME&&c.userId===ME.id?`<button class="cdel" data-cdel="${esc(c.id)}">ลบ</button>`:''}<p>${esc(c.text)}</p></div></div>`).join(''):'<p class="mu">ยังไม่มีความคิดเห็น เป็นคนแรกเลย</p>';
    $('#ccount').textContent=r.length;
    const g=ALL.find(x=>x.id===id);if(g&&g.commentCount!==r.length){g.commentCount=r.length;stale=true;}
  }catch(e){$('#clist').innerHTML='<p class="mu">โหลดความคิดเห็นไม่สำเร็จ</p>';}
}
async function sendC(){
  const name=$('#cn')?$('#cn').value.trim():'',text=$('#ct').value.trim(),m=$('#cmsg');
  m.textContent='กำลังส่ง...';
  try{const r=await fetch(`${API}/api/games/${cur.id}/comments`,{method:'POST',headers:hdr(),body:JSON.stringify({name,text})});
    const d=await r.json();
    if(r.status===401&&d.needLogin){toLogin();return;}
    if(!r.ok)throw new Error(d.error||r.status);
    $('#ct').value='';m.textContent='ส่งความคิดเห็นแล้ว ขอบคุณครับ';
    loadComments(cur.id);
  }catch(e){m.textContent='ส่งไม่สำเร็จ: '+e.message;}
}
const voter=()=>{try{let v=localStorage.getItem('duffy-voter');if(!v){v=(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,'');localStorage.setItem('duffy-voter',v);}return v;}catch(_){window.__v=window.__v||('t'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));return window.__v;}};
async function rate(n){
  const m=$('#rmsg');m.textContent='กำลังบันทึก...';
  try{const r=await fetch(`${API}/api/games/${cur.id}/rate`,{method:'POST',headers:hdr(),body:JSON.stringify({voter:voter(),stars:n})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
    Object.assign(cur,d);$('#rsum').innerHTML=sumHtml(cur);$('#mring').innerHTML=ring(cur.score);
    document.querySelectorAll('#rstars .rb').forEach(b=>b.classList.toggle('on',+b.dataset.r<=n));
    const g=ALL.find(x=>x.id===cur.id);if(g){g.score=d.score;stale=true;}
    m.textContent=`ขอบคุณที่ให้ ${n} ดาว (กดดาวอื่นเพื่อเปลี่ยนได้)`;
  }catch(e){m.textContent='ให้คะแนนไม่สำเร็จ: '+e.message;}
}
async function openM(id,jump){
  try{fetch(`${API}/api/games/${id}/view`,{method:'POST',headers:hdr()}).catch(()=>{});cur=await api('/api/games/'+id+'?voter='+encodeURIComponent(voter()));}
  catch(e){if(String(e.message)!=='401')alert('โหลดรีวิวไม่สำเร็จ');return;}
  $('#mb').innerHTML=detail(cur);$('#md').classList.add('show');$('#md').scrollTop=0;document.body.classList.add('lock');
  try{if($('#cn'))$('#cn').value=localStorage.getItem('duffy-name')||''}catch(_){}
  history.replaceState(null,'','#game-'+id);
  await loadComments(id);
  if(jump)$('#cm').scrollIntoView({behavior:'smooth'});
}
function closeM(){
  if(!$('#md').classList.contains('show'))return;
  $('#md').classList.remove('show');document.body.classList.remove('lock');cur=null;
  history.replaceState(null,'',location.pathname+location.search);
  if(stale)render();
}

/* ---------- คลิกทั้งหน้า ---------- */
document.onclick=e=>{
  const t=e.target;
  if(!t.closest('.dd'))closeDD();
  if(t.closest('[data-home]')){reset();return;}
  const ch=t.closest('[data-c]');if(ch){S.cat=ch.dataset.c;render();toList();return;}
  const sg=t.closest('[data-s]');if(sg){S.sort=sg.dataset.s;render();return;}
  const hd=t.closest('[data-hero]');if(hd){setHero(+hd.dataset.hero);return;}
  if(t.closest('[data-jump]')){e.preventDefault();$('#cm').scrollIntoView({behavior:'smooth'});return;}
  if(t.closest('[data-close]')||t.id==='md'){closeM();return;}
  const c=t.closest('[data-i]');if(c){openM(+c.dataset.i,!!c.dataset.j);return;}
  if(t.closest('.send'))sendC();
  const rb=t.closest('[data-r]');if(rb)rate(+rb.dataset.r);
  if(t.closest('#logoutBtn'))logoutM();
  const cd=t.closest('[data-cdel]');if(cd)delMine(cd);
};
document.onkeydown=e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'){if($('#md').classList.contains('show'))closeM();else closeDD();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fimg[data-i]')){e.preventDefault();e.target.click();}
};

/* ================= สมาชิก ================= */
// ต้องเข้าสู่ระบบก่อนใช้เว็บ: ใช้โทเคนสมาชิก หรือโทเคนผู้ดูแล (ถ้าเปิดมาจากหน้า admin)
let ME=null,ADMIN=null;
const MKEY='duffy-member';
let mtoken=null;try{mtoken=localStorage.getItem(MKEY)}catch(_){}
if(!mtoken){try{const a=JSON.parse(localStorage.getItem('duffy-admin')||'null');if(a&&a.token){mtoken=a.token;ADMIN=a.user||'admin';}}catch(_){}}
function hdr(){const h={'Content-Type':'application/json'};if(mtoken)h.Authorization='Bearer '+mtoken;return h;}
// โทเคนหมดอายุ/ใช้ไม่ได้ -> ล้างแล้วไปหน้าเข้าสู่ระบบ (กลับมาหน้าเดิมหลังล็อกอิน)
let leaving=false;
function toLogin(){
  if(leaving)return;leaving=true;
  try{localStorage.removeItem(ADMIN?'duffy-admin':MKEY)}catch(_){}
  location.replace('login.html?next='+encodeURIComponent(location.pathname+location.hash));
}
function renderAcct(){
  $('#acct').innerHTML=ME?`<a class="me" href="profile.html" title="โปรไฟล์ของฉัน (@${esc(ME.username)})"><span class="av" style="--c:${esc(ME.accent||'#ff6a2b')}">${esc(([...ME.name][0]||'?').toUpperCase())}${ME.avatar?`<img src="${esc(imgUrl(ME.avatar))}" alt="">`:''}</span><span class="nm">${esc(ME.name)}</span></a><button class="out" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">${I.out}<span class="t">ออกจากระบบ</span></button>`
    :ADMIN?`<a class="out" href="admin.html">หน้าผู้ดูแล</a>`:'';
}
// ฟอร์มความคิดเห็น: สมาชิกใช้ชื่อจากบัญชี
function cform(){
  const box=`<textarea id="ct" maxlength="500" rows="3" placeholder="แสดงความคิดเห็นเกี่ยวกับเกมนี้..."></textarea><button class="send">ส่งความคิดเห็น</button><span id="cmsg"></span>`;
  if(ME)return `<div class="cf"><span class="asme">แสดงความคิดเห็นในชื่อ <b>${esc(ME.name)}</b></span>${box}</div>`;
  if(ADMIN)return `<div class="need">คุณเข้าใช้ในฐานะผู้ดูแล ต้องใช้บัญชีสมาชิกเพื่อแสดงความคิดเห็น</div>`;
  return '';
}
async function logoutM(){
  try{await fetch(`${API}/api/auth/logout`,{method:'POST',headers:hdr()})}catch(_){}
  try{localStorage.removeItem(MKEY)}catch(_){}
  location.replace('login.html?out=1');
}
async function loadMember(){
  if(!mtoken)return toLogin();
  try{const r=await fetch(`${API}${ADMIN?'/api/admin/me':'/api/auth/me'}`,{headers:hdr()});
    if(r.status===401)return toLogin();
    if(r.ok&&!ADMIN){ME=(await r.json()).user;}
  }catch(_){}
  renderAcct();if($('#cfw'))$('#cfw').innerHTML=cform();if(cur&&$('#clist'))loadComments(cur.id);
}
async function delMine(b){
  if(!confirm('ลบความคิดเห็นนี้?'))return;
  try{const r=await fetch(`${API}/api/comments/${encodeURIComponent(b.dataset.cdel)}`,{method:'DELETE',headers:hdr()});
    if(!r.ok)throw new Error(r.status);loadComments(cur.id);}catch(e){alert('ลบไม่สำเร็จ');}
}

/* ---------- เริ่มทำงาน ---------- */
loadMember();
$('#grid').innerHTML='<div class="sk"></div>'.repeat(6);
$('#hin').innerHTML='<div><div class="kick"><i>D</i>Duffy Review</div><h1>กำลังโหลดรีวิว...</h1><p class="site">เซิร์ฟเวอร์ฟรีอาจใช้เวลาตื่นประมาณ 30–50 วินาทีในครั้งแรก</p></div>';
render();
loadAll();
// กล่อง "ข่าวล่าสุด" (เฉพาะข่าวที่ทีมงานอนุมัติแล้ว) รีเฟรชทุก 2 นาที
const agoS=d=>{const s=(Date.now()-new Date(d))/1000;return s<3600?Math.max(1,Math.floor(s/60))+' นาที':s<86400?Math.floor(s/3600)+' ชม.':Math.floor(s/86400)+' วัน';};
async function loadNewsBox(){
  if(document.hidden)return;
  try{const d=await api('/api/news?limit=5');
    $('#newsBox').hidden=!d.items.length;
    $('#newsList').innerHTML=d.items.map(n=>`<a class="nwi" href="${esc(n.link)}" target="_blank" rel="noopener noreferrer" title="อ่านต้นฉบับที่ ${esc(n.sourceName)}${n.sourceDomain?' ('+esc(n.sourceDomain)+')':''}"><span class="th">${n.image?`<img src="${esc(n.image)}" alt="ภาพจาก ${esc(n.sourceName)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</span><span class="n"><span>${esc(n.titleTh||n.title)}</span><small>ที่มา: <b>${esc(n.sourceName)}</b> · ${agoS(n.published)}ที่แล้ว</small></span></a>`).join('');
  }catch(_){}
}
loadNewsBox();setInterval(loadNewsBox,120000);
const setViews=(id,n)=>document.querySelectorAll(`[data-vw="${id}"]`).forEach(e=>e.textContent=fmt(n));
async function refreshViews(){if(document.hidden||!ALL.length)return;try{const m=await api('/api/views');for(const id in m){setViews(id,m[id]);const g=ALL.find(x=>x.id==id);if(g)g.views=m[id];}}catch(_){}}
setInterval(refreshViews,15000);
const hm=location.hash.match(/^#game-(\d+)$/);if(hm)openM(+hm[1]);
</script>
