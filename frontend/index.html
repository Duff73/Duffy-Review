<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duffy Review | รีวิวเกม คะแนน และความคุ้มค่าก่อนซื้อ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6fa;--sf:#fff;--tx:#14182b;--mu:#667085;--bd:#e3e6ef;--ac:#ff6a2b;--ac2:#7c4dff;--sh:0 4px 18px rgba(20,24,43,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--sf:#171b2e;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--sf:#171b2e;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--sh:0 4px 18px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',system-ui,'Noto Sans Thai',sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sf);border-bottom:1px solid var(--bd)}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.logo i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.logo b{color:var(--ac)}
nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.nb{background:none;border:0;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu)}
.nb:hover,.nb.on{background:var(--bg);color:var(--tx)}
.dd{position:relative}
.dm{display:none;position:absolute;top:100%;left:0;min-width:190px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:6px;margin-top:4px}
.dd.open .dm{display:block}
.dm button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:14px}
.dm button:hover,.dm button.on{background:var(--bg);color:var(--ac)}
.sr{margin-left:auto;position:relative;flex:1 1 220px;max-width:340px}
.sr input{width:100%;padding:9px 38px 9px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
.sr input:focus{outline:2px solid var(--ac);border-color:transparent}
.sr kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:5px;padding:0 6px}
main{max-width:1180px;margin:auto;padding:20px 16px 40px}
.hero{border-radius:20px;padding:34px 28px;color:#fff;background:linear-gradient(120deg,#1b1340,#7c4dff 60%,#ff6a2b);margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:clamp(24px,4vw,38px)}.hero p{margin:0;opacity:.9;max-width:560px}
.layout{display:grid;grid-template-columns:1fr 290px;gap:22px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px;font-size:13px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--mu);font-size:14px;gap:10px;flex-wrap:wrap}
.info h2{margin:0;font-size:20px;color:var(--tx)}
.clear{background:none;border:0;color:var(--ac);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;overflow:hidden;box-shadow:var(--sh);transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.cv{height:130px;position:relative;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:15px}
.sc{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.55);padding:3px 10px;border-radius:10px;font-size:16px}
.ag{position:absolute;top:10px;left:10px;background:#fff;color:#111;padding:1px 8px;border-radius:7px;font-size:12px;font-weight:700}
.cb{padding:12px 14px 14px}.cb h3{margin:0 0 4px;font-size:16px}
.cb p{margin:0 0 10px;color:var(--mu);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu)}
.tag{color:var(--ac2);font-weight:500}
aside .box{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
aside h2{margin:0 0 10px;font-size:17px}
.tp{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-size:14px}
.tp:last-child{border-bottom:0}.rk{width:24px;height:24px;border-radius:7px;background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.tp:nth-child(-n+4) .rk{background:var(--ac);color:#fff}
.tp span.n{flex:1}.tp b{color:var(--ac)}
.empty{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--mu)}
footer{border-top:1px solid var(--bd);text-align:center;padding:22px;color:var(--mu);font-size:13px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:center;z-index:50;padding:16px}
.modal.show{display:grid}.mb{background:var(--sf);border-radius:18px;max-width:480px;width:100%;overflow:hidden}
.mb .cv{height:150px}.mb .cb{padding:18px}.mb button.x{margin-top:12px;border:0;background:var(--ac);color:#fff;padding:9px 20px;border-radius:10px}
.cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cv::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.7))}
.cv .tt{position:relative;z-index:2;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.sc,.ag{z-index:2}
.mb .cv.big{height:240px;font-size:22px}
.act{display:flex;gap:8px;margin-top:12px}
.act button{flex:1;border-radius:10px;padding:8px;font-size:13px;border:1px solid var(--bd);background:var(--bg)}
.act .b1{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:500}
.modal{overflow:auto;place-items:start center}.mb{max-width:760px;margin:4vh auto}
.dt h2{margin:12px 0 8px}
.dt p{display:block;-webkit-line-clamp:unset;overflow:visible;color:var(--tx);margin:0 0 10px}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pc>div{background:var(--bg);border-radius:12px;padding:10px 14px}.pc h4{margin:0 0 4px}.pc ul{margin:0;padding-left:18px;font-size:14px}
@media(max-width:560px){.pc{grid-template-columns:1fr}}
.cf{display:grid;gap:8px;margin:10px 0 16px}
.cf input,.cf select,.cf textarea{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.cf .send{justify-self:start;border:0;background:var(--ac2);color:#fff;padding:9px 18px;border-radius:10px}
#cmsg{font-size:13px;color:var(--mu)}
.cmt{border-top:1px solid var(--bd);padding:10px 0}
.cmt p{white-space:pre-wrap;word-break:break-word;margin:4px 0 0}
.cmt .st{color:#f5a623}.cmt small,.mu{color:var(--mu)}
</style>
</head>
<body>
<header><div class="bar">
<button class="logo" id="home" aria-label="หน้าแรก"><i>D</i><span>Duffy <b>Review</b></span></button>
<nav>
<button class="nb on" id="homeBtn">หน้าแรก</button>
<div class="dd" data-k="cat"><button class="nb">หมวดหมู่เกม ▾</button><div class="dm"></div></div>
<div class="dd" data-k="age"><button class="nb">หมวดหมู่อายุ ▾</button><div class="dm"></div></div>
<div class="dd" data-k="sort"><button class="nb">ความนิยม ▾</button><div class="dm"></div></div>
</nav>
<div class="sr"><input id="q" type="search" placeholder="ค้นหารีวิวเกม..." autocomplete="off"><kbd>/</kbd></div>
</div></header>
<main>
<section class="hero"><h1>Duffy Review</h1><p>รีวิวเกมตรงไปตรงมา พร้อมคะแนนและความคุ้มค่าก่อนซื้อ ครบทั้ง PC, มือถือ และคอนโซล</p></section>
<div class="layout"><div>
<div class="filters" id="chips"></div>
<div class="info"><h2 id="ttl">รีวิวล่าสุด</h2><span><span id="cnt"></span> <button class="clear" id="clr">ล้างตัวกรอง</button></span></div>
<div class="grid" id="grid"></div>
</div>
<aside><div class="box"><h2>Top 10 ยอดนิยม</h2><div id="top"></div></div></aside></div>
</main>
<footer>© 2026 Duffy Review · ข้อมูลรีวิวเป็นข้อมูลตัวอย่าง</footer>
<div class="modal" id="md"><div class="mb" id="mb"></div></div>
<script src="config.js"></script>
<script>
const CATS=["ทั้งหมด","แอคชัน","RPG","ผจญภัย","แข่งรถ","จำลอง","ต่อสู้"];
const AGES=[["ทั้งหมด","ทุกช่วงอายุ"],[3,"3+ ทุกวัย"],[7,"7+"],[12,"12+"],[16,"16+"],[18,"18+"]];
const SORTS=[["new","ใหม่ล่าสุด"],["pop","ยอดนิยมสุด"],["score","คะแนนสูงสุด"]];
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const S={q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"};
const $=s=>document.querySelector(s);
const opts={cat:CATS.map(c=>[c,c]),age:AGES,sort:SORTS};
let seq=0,timer,first=true,cur=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const bg=g=>`linear-gradient(135deg,hsl(${g.hue},70%,45%),hsl(${(g.hue+60)%360},65%,30%))`;
const img=g=>g.image?`<img src="${esc(g.image)}" alt="${esc(g.title)}" loading="lazy" onerror="this.remove()">`:'';
async function api(p){const r=await fetch(API+p);if(!r.ok)throw new Error(r.status);return r.json();}
function dd(){document.querySelectorAll('.dd').forEach(el=>{const k=el.dataset.k;
el.querySelector('.dm').innerHTML=opts[k].map(([v,l])=>`<button data-v="${v}" class="${String(S[k])===String(v)?'on':''}">${l}</button>`).join('');});}
function chips(){$('#chips').innerHTML=CATS.map(c=>`<button class="chip ${S.cat===c?'on':''}" data-c="${c}">${c}</button>`).join('');}
const card=g=>`<article class="card"><div class="cv" style="background:${bg(g)}">${img(g)}<span class="ag">${g.age}+</span><span class="sc">${g.score}</span><span class="tt">${esc(g.title)}</span></div><div class="cb"><h3>รีวิว ${esc(g.title)}</h3><p>${esc(g.desc)}</p><div class="mt"><span class="tag">${esc(g.category)}</span><span>👁 ${g.views.toLocaleString()}</span></div><div class="act"><button class="b1" data-i="${g.id}">📖 อ่านรีวิว</button><button class="b2" data-i="${g.id}" data-j="1">💬 ความคิดเห็น (${g.commentCount})</button></div></div></article>`;
async function render(){
dd();chips();
const q=S.q.trim();
$('#homeBtn').classList.toggle('on',!q&&S.cat==="ทั้งหมด"&&S.age==="ทั้งหมด"&&S.sort==="new");
const sl=SORTS.find(s=>s[0]===S.sort)[1];
$('#ttl').textContent=q?`ผลการค้นหา “${q}”`:(sl==="ใหม่ล่าสุด"?"รีวิวล่าสุด":sl);
const my=++seq;
if(first)$('#grid').innerHTML='<div class="empty">⏳ กำลังโหลดข้อมูล...<br><small>(เซิร์ฟเวอร์ฟรีอาจใช้เวลาปลุกประมาณ 30–50 วินาทีในครั้งแรก)</small></div>';
try{
const r=await api('/api/games?'+new URLSearchParams({q,cat:S.cat,age:S.age,sort:S.sort}));
if(my!==seq)return;first=false;
$('#cnt').textContent=r.total+" รายการ";
$('#grid').innerHTML=r.items.length?r.items.map(card).join(''):'<div class="empty">😕 ไม่พบรีวิวที่ตรงกับการค้นหา<br>ลองใช้คำอื่น หรือล้างตัวกรอง</div>';
}catch(e){if(my!==seq)return;$('#cnt').textContent="";$('#grid').innerHTML='<div class="empty">⚠️ เชื่อมต่อเซิร์ฟเวอร์ไม่ได้<br>ตรวจสอบค่า API URL ในไฟล์ config.js</div>';}
}
async function loadTop(){try{const t=await api('/api/top');$('#top').innerHTML=t.map((g,i)=>`<button class="tp" data-i="${g.id}"><span class="rk">${i+1}</span><span class="n">${esc(g.title)}</span><b>${g.score}</b></button>`).join('');}catch(e){$('#top').innerHTML='<small>โหลดไม่สำเร็จ</small>';}}
function detail(g){
const paras=(g.review||g.desc).split(/\n\n/).map(p=>`<p>${esc(p)}</p>`).join('');
const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
const opt=[5,4,3,2,1].map(n=>`<option value="${n}">${stars(n)}</option>`).join('');
return `<div class="cv big" style="background:${bg(g)}">${img(g)}<span class="ag">${g.age}+</span><span class="sc">${g.score}</span><span class="tt">${esc(g.title)}</span></div>
<div class="cb dt"><div class="mt"><span class="tag">${esc(g.category)}</span><span>🎮 ${esc(g.platforms)}</span><span>👁 ${g.views.toLocaleString()}</span></div>
<h2>รีวิว ${esc(g.title)}</h2>${paras}
<div class="pc"><div><h4>👍 จุดเด่น</h4><ul>${li(g.pros)}</ul></div><div><h4>👎 จุดด้อย</h4><ul>${li(g.cons)}</ul></div></div>
<h3 id="cm">💬 ความคิดเห็น (<span id="ccount">${g.commentCount}</span>)${g.readerRating?` · คะแนนผู้อ่าน ★ ${g.readerRating} (${g.readerVotes} โหวต)`:''}</h3>
<div class="cf"><input id="cn" maxlength="30" placeholder="ชื่อของคุณ"><select id="cr"><option value="">ให้คะแนน (ไม่บังคับ)</option>${opt}</select><textarea id="ct" maxlength="500" rows="3" placeholder="แสดงความคิดเห็นเกี่ยวกับเกมนี้..."></textarea><button class="send">ส่งความคิดเห็น</button><span id="cmsg"></span></div>
<div id="clist"></div><button class="x">ปิด</button></div>`;}
async function loadComments(id){
try{const r=await api(`/api/games/${id}/comments`);
$('#clist').innerHTML=r.length?r.map(c=>`<div class="cmt"><b>${esc(c.name)}</b> <span class="st">${c.rating?stars(c.rating):''}</span> <small>${new Date(c.date).toLocaleDateString('th-TH')}</small><p>${esc(c.text)}</p></div>`).join(''):'<p class="mu">ยังไม่มีความคิดเห็น เป็นคนแรกเลย!</p>';
$('#ccount').textContent=r.length;}catch(e){$('#clist').innerHTML='<p class="mu">โหลดความคิดเห็นไม่สำเร็จ</p>';}}
async function sendC(){
const name=$('#cn').value.trim(),text=$('#ct').value.trim(),rating=+$('#cr').value||null,m=$('#cmsg');
m.textContent='กำลังส่ง...';
try{const r=await fetch(`${API}/api/games/${cur.id}/comments`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,text,rating})});
const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
$('#ct').value='';m.textContent='ส่งความคิดเห็นแล้ว ขอบคุณครับ 🎉';
try{localStorage.setItem('duffy-name',name)}catch(_){}
loadComments(cur.id);render();
}catch(e){m.textContent='ส่งไม่สำเร็จ: '+e.message;}}
async function openM(id,jump){
try{cur=await api('/api/games/'+id);}catch(e){alert('โหลดรีวิวไม่สำเร็จ');return;}
$('#mb').innerHTML=detail(cur);$('#md').classList.add('show');
try{$('#cn').value=localStorage.getItem('duffy-name')||''}catch(_){}
history.replaceState(null,'','#game-'+id);
await loadComments(id);
if(jump)$('#cm').scrollIntoView({behavior:'smooth'});}
function closeM(){$('#md').classList.remove('show');history.replaceState(null,'',location.pathname+location.search);}
function reset(){Object.assign(S,{q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"});$('#q').value="";render();scrollTo({top:0,behavior:'smooth'});}
$('#home').onclick=$('#homeBtn').onclick=$('#clr').onclick=reset;
$('#q').oninput=e=>{S.q=e.target.value;clearTimeout(timer);timer=setTimeout(render,250);};
$('#chips').onclick=e=>{const c=e.target.dataset.c;if(c){S.cat=c;render();}};
document.querySelectorAll('.dd').forEach(el=>{
el.querySelector('.nb').onclick=e=>{e.stopPropagation();const o=el.classList.contains('open');document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'));if(!o)el.classList.add('open');};
el.querySelector('.dm').onclick=e=>{const v=e.target.dataset.v;if(v===undefined)return;S[el.dataset.k]=v;el.classList.remove('open');render();};});
document.onclick=e=>{document.querySelectorAll('.dd').forEach(x=>x.classList.remove('open'));
const c=e.target.closest('[data-i]');if(c)openM(+c.dataset.i,!!c.dataset.j);
if(e.target.classList.contains('send'))sendC();
if(e.target.id==='md'||e.target.classList.contains('x'))closeM();};
document.onkeydown=e=>{if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}if(e.key==='Escape')closeM();};
render();loadTop();
const hm=location.hash.match(/^#game-(\d+)$/);if(hm)openM(+hm[1]);
</script>
</body>
</html>
