<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Duffy Review | รีวิวเกม คะแนน และความคุ้มค่าก่อนซื้อ</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>/* ยังไม่ได้เข้าสู่ระบบ -> ไปหน้าเข้าสู่ระบบทันที (ก่อนหน้าเว็บแสดง) */try{if(!localStorage.getItem('duffy-member')&&!localStorage.getItem('duffy-admin'))location.replace('login.html?next='+encodeURIComponent(location.pathname+location.hash));}catch(_){}</script>
<script>/* โหมดสว่าง/มืดที่เคยเลือกไว้ */try{const t=localStorage.getItem('duffy-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== สี (สว่างเป็นค่าเริ่มต้น มีโหมดมืด) ===================== */
:root{--bg:#f4f5fa;--sf:#fff;--sf2:#f1f2f8;--tx:#14182b;--mu:#667085;--bd:#e3e6ef;--ac:#ff6a2b;--ac2:#7c4dff;--gold:#f5a623;--good:#16a34a;--bad:#e5484d;
  --sh:0 4px 18px rgba(20,24,43,.07);--sh2:0 14px 34px rgba(20,24,43,.14);--pad:16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1120;--sf:#171b2e;--sf2:#1f2440;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--good:#3ccf8e;--bad:#ff6b6b;--sh:0 4px 18px rgba(0,0,0,.35);--sh2:0 14px 34px rgba(0,0,0,.5);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1120;--sf:#171b2e;--sf2:#1f2440;--tx:#eef0f8;--mu:#9aa3bd;--bd:#2a3050;--good:#3ccf8e;--bad:#ff6b6b;--sh:0 4px 18px rgba(0,0,0,.35);--sh2:0 14px 34px rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Prompt',system-ui,'Noto Sans Thai',sans-serif;line-height:1.5}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
svg{flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad)}

/* ===================== หัวเว็บ ===================== */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--sf) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--bd)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:20px;white-space:nowrap}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.logo b{color:var(--ac)}
.nav{display:flex;gap:2px;align-items:center;margin-left:8px}
.nb{display:flex;align-items:center;gap:4px;padding:8px 12px;border-radius:10px;font-size:14px;font-weight:500;color:var(--mu);white-space:nowrap}
.nb:hover,.nb.on{background:var(--sf2);color:var(--tx)}
.nb svg{width:12px;height:12px;transition:transform .2s}
.dd{position:relative}.dd.open .nb svg{transform:rotate(180deg)}
.dm{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:200px;max-height:60vh;overflow:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px;box-shadow:var(--sh2);padding:6px}
.dd.open .dm{display:block}
.dm button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.dm button:hover{background:var(--sf2)}.dm button.on{color:var(--ac);font-weight:600}
.dm small{color:var(--mu)}
.sr{margin-left:auto;position:relative;flex:1 1 200px;max-width:320px}
.sr svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mu);pointer-events:none}
.sr input{width:100%;padding:9px 38px 9px 36px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;font-size:14px}
.sr input:focus{outline:2px solid var(--ac);border-color:transparent;background:var(--sf)}
.sr kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:inherit;font-size:12px;color:var(--mu);border:1px solid var(--bd);border-radius:5px;padding:0 6px}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--mu)}
.ib:hover{background:var(--sf2);color:var(--tx)}.ib svg{width:19px;height:19px}
.acct{display:flex;align-items:center;gap:8px}
.me{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;max-width:170px}
.me .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.out{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.out:hover{background:var(--sf2)}.out svg{width:16px;height:16px}
@media(max-width:900px){
  .bar{flex-wrap:wrap;height:auto;padding:10px 0 6px;gap:8px 10px}
  .nav{order:5;width:100%;margin:0;overflow-x:auto;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}
  .dm{position:fixed;left:var(--pad);right:var(--pad);min-width:0}
  .sr{order:4;flex-basis:100%;max-width:none}.sr kbd{display:none}
  .me .nm,.out .t{display:none}.out{padding:7px 9px}
  .bar .sp{flex:1}
}

/* ===================== แบนเนอร์ (ไล่สีแบบเว็บเดิม) ===================== */
.hero{position:relative;margin:22px 0;border-radius:24px;overflow:hidden;color:#fff;background:linear-gradient(120deg,#1b1340 0%,#5b34d6 48%,#7c4dff 62%,#ff6a2b 100%)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 12% 120%,rgba(255,255,255,.18),transparent 40%),radial-gradient(circle at 95% -10%,rgba(255,190,140,.35),transparent 38%);pointer-events:none}
.hero::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent,#000 60%);pointer-events:none}
.hin{position:relative;z-index:1;display:grid;grid-template-columns:1.05fr 1fr;gap:34px;align-items:center;padding:38px 40px}
.kick{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px;font-weight:500;margin-bottom:14px}
.kick i{width:20px;height:20px;border-radius:50%;background:#fff;color:var(--ac2);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700}
.hero h1{margin:0 0 6px;font-size:clamp(28px,3.6vw,44px);line-height:1.12}
.hero .site{margin:0 0 16px;opacity:.85;font-size:15px}
.hmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px;font-size:14px}
.pill{background:rgba(255,255,255,.18);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:500}
.hero p.d{margin:0 0 20px;opacity:.92;max-width:520px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:10px 18px;font-size:15px;font-weight:600;white-space:nowrap;transition:transform .15s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}.btn svg{width:18px;height:18px}
.btn.w{background:#fff;color:#2b1a6b}.btn.w:hover{filter:brightness(.94)}
.btn.o{border:1.5px solid rgba(255,255,255,.7);color:#fff}.btn.o:hover{background:rgba(255,255,255,.12)}
.btn.a{background:var(--ac);color:#fff}.btn.a:hover{filter:brightness(1.07)}
.btn.g{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.btn.g:hover{background:var(--bd)}
.feat{position:relative}
.fimg{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;box-shadow:0 24px 50px rgba(20,10,60,.45);transform:rotate(1.5deg);border:4px solid rgba(255,255,255,.9);background:#2b1a6b}
.fimg img,.fimg .fill,.cv img,.cv .fill,.mcv img,.mcv .fill,.th img,.th .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fimg.in{animation:fin .6s ease}
@keyframes fin{from{opacity:0;transform:rotate(1.5deg) translateY(10px)}}
.thumbs{display:flex;gap:10px;margin-top:18px;justify-content:flex-end}
.thumbs button{position:relative;width:76px;aspect-ratio:16/9;border-radius:9px;overflow:hidden;border:2px solid rgba(255,255,255,.35);opacity:.75;transition:opacity .2s,border-color .2s,transform .2s;background:#2b1a6b}
.thumbs button img,.thumbs button .fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumbs button:hover{opacity:1;transform:translateY(-2px)}
.thumbs button.on{opacity:1;border-color:#fff}
.ring{--v:0;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:conic-gradient(var(--rc,var(--gold)) calc(var(--v)*1%),rgba(255,255,255,.25) 0)}
.ring::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--rb,#3b2496)}
.ring b{position:relative;font-size:15px;font-weight:700}
@media(max-width:860px){.hin{grid-template-columns:minmax(0,1fr);padding:22px 18px;gap:20px}.feat{order:-1}.fimg{transform:none}.fimg.in{animation:none}
  .thumbs{justify-content:flex-start;gap:8px}.thumbs button{flex:1 1 0;width:auto;min-width:0}
  .hbtns .btn{flex:1 1 auto;justify-content:center;padding:10px 14px;font-size:14px}
  .hero{margin:14px 0;border-radius:18px}}

/* ===================== แถบหมวด + เรียง ===================== */
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.chip{border:1px solid var(--bd);background:var(--sf);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:500;transition:background .15s,border-color .15s}
.chip:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip small{opacity:.65;margin-left:4px}
.seg{display:flex;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:3px}
.seg button{padding:6px 12px;border-radius:9px;font-size:13px;font-weight:500;color:var(--mu);white-space:nowrap}
.seg button.on{background:var(--tx);color:var(--sf)}
@media(max-width:900px){.chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 calc(var(--pad)*-1);padding:0 var(--pad)}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap}}

/* ===================== เนื้อหา + แถบข้าง ===================== */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;padding-bottom:40px}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.info{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.info h2{margin:0;font-size:21px}
.info .cnt{color:var(--mu);font-size:14px}
.clear{color:var(--ac);font-size:14px;font-weight:500;margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:18px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh2)}
.cv{position:relative;aspect-ratio:16/9;background:var(--sf2);overflow:hidden;cursor:pointer}
.cv img{transition:transform .5s}
.card:hover .cv img{transform:scale(1.05)}
.age{position:absolute;top:10px;left:10px;z-index:2;background:#fff;color:#111;font-size:12px;font-weight:700;padding:1px 8px;border-radius:7px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.nw{position:absolute;top:10px;left:48px;z-index:2;background:var(--ac);color:#fff;font-size:12px;font-weight:600;padding:1px 8px;border-radius:7px}
.cv .ring{position:absolute;top:8px;right:8px;z-index:2;width:42px;height:42px;--rb:rgba(15,17,30,.82);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cv .ring b{font-size:14px}
.cb{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tag{align-self:flex-start;font-size:12px;font-weight:600;color:var(--ac2);background:color-mix(in srgb,var(--ac2) 12%,transparent);padding:2px 10px;border-radius:999px}
.cb h3{margin:0;font-size:17px;line-height:1.3}
.cb h3 button{text-align:left}.cb h3 button:hover{color:var(--ac)}
.cb p{margin:0;color:var(--mu);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mt{display:flex;gap:14px;font-size:12.5px;color:var(--mu);margin-top:auto;padding-top:4px}
.mt span{display:inline-flex;align-items:center;gap:4px}.mt svg{width:14px;height:14px}
.act{display:flex;gap:8px;margin-top:8px}
.act button{flex:1;border-radius:11px;padding:9px;font-size:13.5px;font-weight:500;border:1px solid var(--bd);background:var(--sf2)}
.act button:hover{border-color:var(--mu)}
.act .b1{background:var(--ac);border-color:var(--ac);color:#fff}.act .b1:hover{filter:brightness(1.06)}
.empty{grid-column:1/-1;text-align:center;padding:56px 10px;color:var(--mu);background:var(--sf);border:1px dashed var(--bd);border-radius:18px}
.empty b{display:block;color:var(--tx);font-size:17px;margin-bottom:4px}
.sk{border-radius:18px;background:linear-gradient(90deg,var(--sf) 0%,var(--sf2) 50%,var(--sf) 100%);background-size:200% 100%;animation:shim 1.3s linear infinite;height:330px}
@keyframes shim{to{background-position:-200% 0}}

aside{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start;min-width:0}
.box,.tp,.cats button{min-width:0;max-width:100%}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh)}
@media(min-width:961px){aside{position:sticky;top:84px}}
.box h2{margin:0 0 10px;font-size:17px;display:flex;align-items:center;gap:8px}
.box h2 svg{width:18px;height:18px;color:var(--ac)}
.tp{display:flex;gap:10px;align-items:center;width:100%;padding:8px 6px;border-radius:12px;text-align:left}
.tp:hover{background:var(--sf2)}
.rk{width:24px;height:24px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;color:var(--mu)}
.tp:nth-child(1) .rk{background:linear-gradient(135deg,#ffcf5c,#f5a623);color:#5a3a00}
.tp:nth-child(2) .rk{background:linear-gradient(135deg,#e6e9f2,#b9bfd0);color:#333a4d}
.tp:nth-child(3) .rk{background:linear-gradient(135deg,#f3b58a,#c8794a);color:#4a2510}
.th{position:relative;width:58px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;flex:none;background:var(--sf2)}
.tp .n{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.3}
.tp .n small{display:block;color:var(--mu);font-size:12px;font-weight:400}
.tp .n span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp b{color:var(--ac);font-size:14px}
.cats{display:grid;gap:2px}
.cats button{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px;text-align:left}
.cats button:hover{background:var(--sf2)}
.cats button.on{color:var(--ac);font-weight:600}
.cats small{color:var(--mu);background:var(--sf2);border-radius:999px;padding:0 8px;font-size:12px}

footer{border-top:1px solid var(--bd);padding:24px var(--pad);text-align:center;color:var(--mu);font-size:13px}

/* ===================== หน้ารีวิว (ป๊อปอัป) ===================== */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,24,.6);backdrop-filter:blur(3px);display:none;overflow-y:auto;padding:4vh 16px}
.modal.show{display:block}
.mb{position:relative;max-width:820px;margin:0 auto;background:var(--sf);border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.mcv{position:relative;aspect-ratio:16/8;background:var(--sf2)}
.mcv .age{top:14px;left:14px}
.x{position:absolute;top:12px;right:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(15,17,30,.7);color:#fff;display:grid;place-items:center}
.x:hover{background:rgba(15,17,30,.9)}.x svg{width:18px;height:18px}
.mbody{padding:20px clamp(16px,4%,32px) 30px}
.mtop{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.mtop .ring{width:60px;height:60px;--rb:var(--sf);--rc:var(--ac);background:conic-gradient(var(--ac) calc(var(--v)*1%),var(--bd) 0)}
.mtop .ring b{font-size:18px;color:var(--tx)}
.mtop h2{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.2}
.mtop .sub{color:var(--mu);font-size:14px;margin-top:2px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.facts span{display:inline-flex;align-items:center;gap:6px;background:var(--sf2);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--mu)}
.facts b{color:var(--tx);font-weight:500}
.facts svg{width:14px;height:14px}
.mbtns{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
.rv p{margin:0 0 12px;font-size:15.5px;line-height:1.8}
.pc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.pc>div{border-radius:14px;padding:12px 16px;background:color-mix(in srgb,var(--good) 9%,var(--sf))}
.pc>div+div{background:color-mix(in srgb,var(--bad) 9%,var(--sf))}
.pc h4{margin:0 0 6px;font-size:15px;color:var(--good)}.pc>div+div h4{color:var(--bad)}
.pc ul{margin:0;padding-left:18px;font-size:14px}.pc li{margin:3px 0}
@media(max-width:560px){.pc{grid-template-columns:1fr}.mcv{aspect-ratio:16/10}}
.rate{background:var(--sf2);border-radius:14px;padding:14px 16px;margin:18px 0}
.rate b{color:var(--ac)}
.rstars{display:flex;gap:4px;margin:6px 0}
.rb{font-size:32px;line-height:1;color:var(--bd);padding:0 2px;transition:transform .1s}
.rb:hover{transform:scale(1.12)}
.rstars:hover .rb{color:var(--gold)}.rb:hover~.rb{color:var(--bd)}.rb.on{color:var(--gold)}
.mu{color:var(--mu)}
.sec-h{font-size:18px;margin:26px 0 10px}
.cf{display:grid;gap:8px;margin:0 0 14px}
.cf textarea,.cf input{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;resize:vertical}
.cf textarea:focus{outline:2px solid var(--ac);border-color:transparent}
.cf .send{justify-self:start;background:var(--ac2);color:#fff;padding:9px 18px;border-radius:11px;font-weight:600}
.cf .send:hover{filter:brightness(1.08)}
#cmsg{font-size:13px;color:var(--mu)}
.asme{font-size:13px;color:var(--mu)}.asme b{color:var(--tx)}
.need{background:var(--sf2);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:14px;color:var(--mu)}
.cmt{display:flex;gap:12px;border-top:1px solid var(--bd);padding:12px 0}
.cmt .av{width:34px;height:34px;font-size:13px}
.cmt .av.g{background:var(--sf2);color:var(--mu)}
.cmt>div{flex:1;min-width:0}
.cmt p{white-space:pre-wrap;word-break:break-word;margin:3px 0 0;font-size:14.5px}
.cmt small{color:var(--mu)}
.badge{font-size:11px;font-weight:600;color:var(--ac2);border:1px solid var(--ac2);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:1px}
.cdel{font-size:12px;color:var(--mu);margin-left:8px;text-decoration:underline}.cdel:hover{color:var(--bad)}
.sim{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.mini{text-align:left;border-radius:14px;overflow:hidden;background:var(--sf2);transition:transform .2s}
.mini:hover{transform:translateY(-3px)}
.mini .cv{aspect-ratio:16/9}
.mini span{display:block;padding:8px 10px;font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header><div class="wrap bar">
  <button class="logo" data-home aria-label="หน้าแรก Duffy Review"><i>D</i><span>Duffy <b>Review</b></span></button>
  <nav class="nav" aria-label="เมนูหลัก">
    <button class="nb on" id="homeBtn" data-home>หน้าแรก</button>
    <div class="dd" data-k="cat"><button class="nb" aria-haspopup="true">หมวดหมู่เกม<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button><div class="dm"></div></div>
    <div class="dd" data-k="age"><button class="nb" aria-haspopup="true">หมวดหมู่อายุ<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m6 9 6 6 6-6"/></svg></button><div class="dm"></div></div>
  </nav>
  <span class="sp"></span>
  <div class="sr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="ค้นหารีวิวเกม..." autocomplete="off" aria-label="ค้นหารีวิวเกม"><kbd>/</kbd></div>
  <button class="ib" id="theme" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด"></button>
  <div class="acct" id="acct"></div>
</div></header>

<main class="wrap">
  <section class="hero" id="hero" aria-label="รีวิวเด่น"><div class="hin" id="hin"></div></section>
  <div class="tools"><div class="chips" id="chips"></div>
    <div class="seg" id="seg" role="tablist" aria-label="เรียงตาม"></div></div>
  <div class="layout">
    <section>
      <div class="info"><h2 id="ttl">รีวิวล่าสุด</h2><span><span class="cnt" id="cnt"></span><button class="clear" id="clr" data-home hidden>ล้างตัวกรอง</button></span></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside>
      <div class="box"><h2><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.3l-5.8 3.1 1.2-6.5L2.6 9.4l6.5-.8z"/></svg>Top 10 คะแนนสูงสุด</h2><div id="top"></div></div>
      <div class="box"><h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>หมวดหมู่</h2><div class="cats" id="cats"></div></div>
    </aside>
  </div>
</main>
<footer>© 2026 Duffy Review</footer>

<div class="modal" id="md" role="dialog" aria-modal="true" aria-label="รีวิวเกม"><div class="mb" id="mb"></div></div>

<script src="config.js"></script>
<script>
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const imgUrl=s=>/^\/api\/images\/\d+$/.test(s)?API+s:/%[0-9a-f]{2}/i.test(s)?s:encodeURI(s); // รูปที่อัปโหลดผ่าน admin อยู่บนเซิร์ฟเวอร์ Render
const fillBg=g=>`linear-gradient(135deg,hsl(${g.hue??200},70%,45%),hsl(${((g.hue??200)+60)%360},65%,30%))`;
const art=(g,lazy=true)=>`<div class="fill" style="background:${fillBg(g)}"></div>${g.image?`<img src="${esc(imgUrl(g.image))}" alt="" ${lazy?'loading="lazy"':''} onerror="this.remove()">`:''}`;
const fmt=n=>Number(n||0).toLocaleString('th-TH');
const thDate=d=>{try{return new Date(d).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}catch(_){return d}};
const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
const ring=s=>`<span class="ring" style="--v:${Math.max(0,Math.min(100,s*10))}"><b>${s}</b></span>`;
if('scrollRestoration' in history)history.scrollRestoration='manual';

/* ---------- ไอคอน (SVG ไม่ใช้อิโมจิ) ---------- */
const I={
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/><path d="M9 7h6"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  pad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 13.5h.01"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg>',
  sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
};

/* ---------- โหมดสว่าง/มืด ---------- */
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
function paintTheme(){$('#theme').innerHTML=isDark()?I.sun:I.moon;}
$('#theme').onclick=()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('duffy-theme',t)}catch(_){}paintTheme();};
paintTheme();

/* ---------- ปุ่มดูราคา: ลิงก์ที่ admin ใส่ไว้ หรือค้นหาบน Steam ---------- */
const STORES={'store.steampowered.com':'Steam','steampowered.com':'Steam','store.epicgames.com':'Epic Games Store','epicgames.com':'Epic Games Store','store.playstation.com':'PlayStation Store','playstation.com':'PlayStation Store','xbox.com':'Xbox Store','nintendo.com':'Nintendo eShop','gog.com':'GOG','play.google.com':'Google Play','apps.apple.com':'App Store','ea.com':'EA','ubisoft.com':'Ubisoft Store'};
function storeInfo(g){
  if(/^https?:\/\//i.test(g.link||'')){
    let host='';try{host=new URL(g.link).hostname.replace(/^www\./,'')}catch(_){}
    const d=Object.keys(STORES).find(k=>host===k||host.endsWith('.'+k));
    return {href:g.link,label:d?'ดูราคาบน '+STORES[d]:'ไปหน้าเว็บเกม',note:host};
  }
  return {href:'https://store.steampowered.com/search/?term='+encodeURIComponent(g.title),label:'ค้นหาราคาบน Steam',note:'ค้นหาชื่อเกมนี้บน Steam'};
}
const storeBtn=(g,cls)=>{const s=storeInfo(g);return `<a class="btn ${cls}" href="${esc(s.href)}" target="_blank" rel="noopener noreferrer" title="${esc(s.note)}">${I.ext}${esc(s.label)}</a>`;};

/* ---------- ข้อมูล ---------- */
const SORTS=[["new","ใหม่ล่าสุด","รีวิวล่าสุด"],["pop","ยอดนิยม","ยอดนิยมสุด"],["score","คะแนนสูงสุด","คะแนนสูงสุด"]];
const S={q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"};
let ALL=[],CATS=[],AGES=[],NEW_IDS=new Set(),cur=null,stale=false;
const byScore=(a,b)=>b.score-a.score||b.views-a.views;
const byNew=(a,b)=>String(b.date).localeCompare(String(a.date))||b.id-a.id;
const byPop=(a,b)=>b.views-a.views||b.score-a.score;
async function api(p){const r=await fetch(API+p,{headers:hdr()});if(r.status===401){toLogin();throw new Error(401);}if(!r.ok)throw new Error(r.status);return r.json();}

async function loadAll(){
  try{
    const r=await api('/api/games?sort=new');
    ALL=r.items||[];
    const n={};ALL.forEach(g=>{n[g.category]=(n[g.category]||0)+1;});
    CATS=Object.keys(n).sort((a,b)=>n[b]-n[a]).map(c=>[c,n[c]]);
    AGES=[...new Set(ALL.map(g=>g.age))].sort((a,b)=>a-b);
    NEW_IDS=new Set([...ALL].sort(byNew).slice(0,3).map(g=>g.id));
    buildHero();render();
  }catch(e){
    if(String(e.message)==='401')return;
    $('#hin').innerHTML='<div><h1>Duffy Review</h1><p class="site">เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ เซิร์ฟเวอร์ฟรีอาจกำลังตื่น ลองรีเฟรชอีกครั้งในอีกสักครู่</p></div>';
    $('#grid').innerHTML='<div class="empty"><b>โหลดรีวิวไม่สำเร็จ</b>ลองรีเฟรชหน้านี้อีกครั้ง</div>';
  }
}

/* ---------- การ์ดเกม (แบบเว็บเดิม) ---------- */
const card=g=>`<article class="card">
<div class="cv" data-i="${g.id}">${art(g)}<span class="age">${g.age}+</span>${NEW_IDS.has(g.id)?'<span class="nw">ใหม่</span>':''}${ring(g.score)}</div>
<div class="cb"><span class="tag">${esc(g.category)}</span><h3><button data-i="${g.id}">${esc(g.title)}</button></h3><p>${esc(g.desc)}</p>
<div class="mt"><span>${I.eye}<b class="vw" data-vw="${g.id}">${fmt(g.views)}</b></span><span>${I.chat}${g.commentCount}</span>${g.platforms?`<span>${I.pad}${esc(g.platforms)}</span>`:''}</div>
<div class="act"><button class="b1" data-i="${g.id}">อ่านรีวิว</button><button data-i="${g.id}" data-j="1">ความคิดเห็น (${g.commentCount})</button></div></div></article>`;

function filtered(){
  const q=S.q.trim().toLowerCase();
  return ALL.filter(g=>(S.cat==='ทั้งหมด'||g.category===S.cat)&&(S.age==='ทั้งหมด'||String(g.age)===String(S.age))
    &&(!q||`${g.title} ${g.category} ${g.desc} ${g.platforms}`.toLowerCase().includes(q)))
    .sort(S.sort==='pop'?byPop:S.sort==='score'?byScore:byNew);
}
const isFiltered=()=>!!S.q.trim()||S.cat!=='ทั้งหมด'||S.age!=='ทั้งหมด';
function render(){
  const f=isFiltered(),q=S.q.trim();
  $('#homeBtn').classList.toggle('on',!f&&S.sort==='new');
  document.querySelectorAll('.dd').forEach(el=>el.querySelector('.nb').classList.toggle('on',String(S[el.dataset.k])!=='ทั้งหมด'));
  $('#clr').hidden=!f;
  $('#hero').hidden=!!q;
  dd();
  $('#chips').innerHTML=[['ทั้งหมด',ALL.length],...CATS].map(([c,n])=>`<button class="chip ${S.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`).join('');
  $('#seg').innerHTML=SORTS.map(([v,l])=>`<button role="tab" aria-selected="${S.sort===v}" class="${S.sort===v?'on':''}" data-s="${v}">${l}</button>`).join('');
  $('#cats').innerHTML=CATS.map(([c,n])=>`<button class="${S.cat===c?'on':''}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`).join('');
  if(!ALL.length)return;
  const list=filtered(),sl=SORTS.find(s=>s[0]===S.sort)[2];
  $('#ttl').textContent=q?`ผลการค้นหา “${q}”`:S.cat!=='ทั้งหมด'?`รีวิวหมวด${S.cat}`:S.age!=='ทั้งหมด'?`เกมเรต ${S.age}+`:sl;
  $('#cnt').textContent=list.length+' รายการ';
  $('#grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty"><b>ไม่พบรีวิวที่ตรงกับการค้นหา</b>ลองใช้คำอื่น หรือล้างตัวกรอง</div>';
  $('#top').innerHTML=[...ALL].sort(byScore).slice(0,10).map((g,i)=>`<button class="tp" data-i="${g.id}"><span class="rk">${i+1}</span><span class="th">${art(g)}</span><span class="n"><span>${esc(g.title)}</span><small>${esc(g.category)}</small></span><b>${g.score}</b></button>`).join('');
  stale=false;
}

/* ---------- แบนเนอร์: รีวิวเด่น 4 เกมคะแนนสูงสุด ---------- */
let HERO=[],hi=0,htimer=null;
function buildHero(){HERO=[...ALL].sort((a,b)=>(!!b.image-!!a.image)||byScore(a,b)).slice(0,4);setHero(0);}
function setHero(i){
  if(!HERO.length){$('#hin').innerHTML='<div><h1>Duffy Review</h1><p class="site">รีวิวเกมตรงไปตรงมา พร้อมคะแนนและความคุ้มค่าก่อนซื้อ</p></div>';return;}
  hi=(i+HERO.length)%HERO.length;const g=HERO[hi];
  $('#hin').innerHTML=`<div>
<div class="kick"><i>D</i>รีวิวเด่นจาก Duffy Review</div>
<h1>${esc(g.title)}</h1>
<p class="site">รีวิวเกมตรงไปตรงมา พร้อมคะแนนและความคุ้มค่าก่อนซื้อ</p>
<div class="hmeta">${ring(g.score)}<span class="pill">${g.age}+</span><span class="pill">${esc(g.category)}</span>${g.platforms?`<span>${esc(g.platforms)}</span>`:''}</div>
<p class="d">${esc(g.desc||'')}</p>
<div class="hbtns"><button class="btn w" data-i="${g.id}">${I.book}อ่านรีวิว</button>${storeBtn(g,'o')}</div></div>
<div class="feat"><div class="fimg in" data-i="${g.id}" role="button" aria-label="อ่านรีวิว ${esc(g.title)}" style="cursor:pointer">${art(g,false)}</div>
${HERO.length>1?`<div class="thumbs">${HERO.map((x,j)=>`<button data-hero="${j}" class="${j===hi?'on':''}" aria-label="แสดง ${esc(x.title)}">${art(x)}</button>`).join('')}</div>`:''}</div>`;
  clearInterval(htimer);
  if(HERO.length>1&&!matchMedia('(prefers-reduced-motion: reduce)').matches)
    htimer=setInterval(()=>{if(!document.hidden&&!$('#md').classList.contains('show')&&!$('#hero').hidden&&!$('#hero').matches(':hover'))setHero(hi+1);},9000);
}

/* ---------- เมนูหมวด / อายุ ---------- */
function opts(k){
  if(k==='cat')return [['ทั้งหมด','ทุกหมวด',ALL.length],...CATS.map(([c,n])=>[c,c,n])];
  return [['ทั้งหมด','ทุกช่วงอายุ'],...AGES.map(a=>[String(a),a<=3?'3+ ทุกวัย':a+'+'])];
}
function dd(){document.querySelectorAll('.dd').forEach(el=>{const k=el.dataset.k;
  el.querySelector('.dm').innerHTML=opts(k).map(([v,l,n])=>`<button data-v="${esc(v)}" class="${String(S[k])===String(v)?'on':''}">${esc(l)}${n!=null?`<small>${n}</small>`:''}</button>`).join('');});}
document.querySelectorAll('.dd').forEach(el=>{
  el.querySelector('.nb').onclick=e=>{e.stopPropagation();const o=el.classList.contains('open');closeDD();
    if(!o){el.classList.add('open');if(innerWidth<=900)el.querySelector('.dm').style.top=$('header').getBoundingClientRect().bottom+6+'px';}};
  el.querySelector('.dm').onclick=e=>{const b=e.target.closest('[data-v]');if(!b)return;e.stopPropagation();S[el.dataset.k]=b.dataset.v;closeDD();render();toList();};
});
const closeDD=()=>document.querySelectorAll('.dd').forEach(x=>{x.classList.remove('open');x.querySelector('.dm').style.top='';});
const toList=()=>{const t=$('.tools').getBoundingClientRect().top+scrollY-80;if(scrollY>t)scrollTo({top:t,behavior:'smooth'});};

/* ---------- ค้นหา ---------- */
let qt;
$('#q').oninput=e=>{S.q=e.target.value;clearTimeout(qt);qt=setTimeout(render,200);};
function reset(){Object.assign(S,{q:"",cat:"ทั้งหมด",age:"ทั้งหมด",sort:"new"});$('#q').value='';render();scrollTo({top:0,behavior:'smooth'});}

/* ---------- หน้ารีวิว ---------- */
const sumHtml=g=>`คะแนนรวม <b>${g.score}</b>/10 · ทีมงาน ${g.editorScore} · ผู้อ่าน ${g.readerVotes?`★ ${g.readerRating} (${g.readerVotes} โหวต)`:'ยังไม่มีโหวต'}`;
function detail(g){
  const paras=(g.review||g.desc||'').split(/\n\n/).map(p=>`<p>${esc(p)}</p>`).join('');
  const li=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const sim=ALL.filter(x=>x.category===g.category&&x.id!==g.id).sort(byScore).slice(0,4);
  return `<button class="x" data-close aria-label="ปิด">${I.x}</button>
<div class="mcv">${art(g,false)}<span class="age">${g.age}+</span></div>
<div class="mbody">
<div class="mtop"><span id="mring">${ring(g.score)}</span><div><h2>${esc(g.title)}</h2><div class="sub">รีวิวโดย Duffy Review · ${thDate(g.date)}</div></div></div>
<div class="facts"><span><b>${esc(g.category)}</b></span>${g.platforms?`<span>${I.pad}<b>${esc(g.platforms)}</b></span>`:''}<span>${I.eye}<b class="vw" data-vw="${g.id}">${fmt(g.views)}</b> ครั้ง</span><span>${I.cal}${thDate(g.date)}</span></div>
<div class="mbtns">${storeBtn(g,'a')}<a class="btn g" href="#cm" data-jump>${I.chat}ไปที่ความคิดเห็น</a></div>
<div class="rv">${paras}</div>
<div class="pc"><div><h4>จุดเด่น</h4><ul>${li(g.pros)}</ul></div><div><h4>จุดด้อย</h4><ul>${li(g.cons)}</ul></div></div>
<div class="rate"><div id="rsum">${sumHtml(g)}</div><div class="rstars" id="rstars">${[1,2,3,4,5].map(n=>`<button class="rb ${n<=(g.myRating||0)?'on':''}" data-r="${n}" aria-label="${n} ดาว">★</button>`).join('')}</div><small id="rmsg" class="mu">${g.myRating?`คะแนนของคุณ: ${g.myRating} ดาว (กดดาวอื่นเพื่อเปลี่ยน)`:'กดดาวเพื่อให้คะแนนเกมนี้'}</small></div>
<h3 class="sec-h" id="cm">ความคิดเห็น (<span id="ccount">${g.commentCount}</span>)</h3>
<div id="cfw">${cform()}</div>
<div id="clist"></div>
${sim.length?`<h3 class="sec-h">รีวิวหมวด${esc(g.category)}อื่นๆ</h3><div class="sim">${sim.map(x=>`<button class="mini" data-i="${x.id}"><div class="cv">${art(x)}<span class="age">${x.age}+</span>${ring(x.score)}</div><span>${esc(x.title)}</span></button>`).join('')}</div>`:''}
</div>`;}
async function loadComments(id){
  try{const r=await api(`/api/games/${id}/comments`);
    $('#clist').innerHTML=r.length?r.map(c=>`<div class="cmt"><span class="av${c.userId?'':' g'}">${esc(([...String(c.name)][0]||'?').toUpperCase())}</span><div><b>${esc(c.name)}</b>${c.userId?'<span class="badge">สมาชิก</span>':''} <small>${thDate(c.date)}</small>${c.rating?` <small>${stars(c.rating)}</small>`:''}${ME&&c.userId===ME.id?`<button class="cdel" data-cdel="${esc(c.id)}">ลบ</button>`:''}<p>${esc(c.text)}</p></div></div>`).join(''):'<p class="mu">ยังไม่มีความคิดเห็น เป็นคนแรกเลย</p>';
    $('#ccount').textContent=r.length;
    const g=ALL.find(x=>x.id===id);if(g&&g.commentCount!==r.length){g.commentCount=r.length;stale=true;}
  }catch(e){$('#clist').innerHTML='<p class="mu">โหลดความคิดเห็นไม่สำเร็จ</p>';}
}
async function sendC(){
  const name=$('#cn')?$('#cn').value.trim():'',text=$('#ct').value.trim(),m=$('#cmsg');
  m.textContent='กำลังส่ง...';
  try{const r=await fetch(`${API}/api/games/${cur.id}/comments`,{method:'POST',headers:hdr(),body:JSON.stringify({name,text})});
    const d=await r.json();
    if(r.status===401&&d.needLogin){toLogin();return;}
    if(!r.ok)throw new Error(d.error||r.status);
    $('#ct').value='';m.textContent='ส่งความคิดเห็นแล้ว ขอบคุณครับ';
    loadComments(cur.id);
  }catch(e){m.textContent='ส่งไม่สำเร็จ: '+e.message;}
}
const voter=()=>{try{let v=localStorage.getItem('duffy-voter');if(!v){v=(window.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,'');localStorage.setItem('duffy-voter',v);}return v;}catch(_){window.__v=window.__v||('t'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));return window.__v;}};
async function rate(n){
  const m=$('#rmsg');m.textContent='กำลังบันทึก...';
  try{const r=await fetch(`${API}/api/games/${cur.id}/rate`,{method:'POST',headers:hdr(),body:JSON.stringify({voter:voter(),stars:n})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);
    Object.assign(cur,d);$('#rsum').innerHTML=sumHtml(cur);$('#mring').innerHTML=ring(cur.score);
    document.querySelectorAll('#rstars .rb').forEach(b=>b.classList.toggle('on',+b.dataset.r<=n));
    const g=ALL.find(x=>x.id===cur.id);if(g){g.score=d.score;stale=true;}
    m.textContent=`ขอบคุณที่ให้ ${n} ดาว (กดดาวอื่นเพื่อเปลี่ยนได้)`;
  }catch(e){m.textContent='ให้คะแนนไม่สำเร็จ: '+e.message;}
}
async function openM(id,jump){
  try{fetch(`${API}/api/games/${id}/view`,{method:'POST',headers:hdr()}).catch(()=>{});cur=await api('/api/games/'+id+'?voter='+encodeURIComponent(voter()));}
  catch(e){if(String(e.message)!=='401')alert('โหลดรีวิวไม่สำเร็จ');return;}
  $('#mb').innerHTML=detail(cur);$('#md').classList.add('show');$('#md').scrollTop=0;document.body.classList.add('lock');
  try{if($('#cn'))$('#cn').value=localStorage.getItem('duffy-name')||''}catch(_){}
  history.replaceState(null,'','#game-'+id);
  await loadComments(id);
  if(jump)$('#cm').scrollIntoView({behavior:'smooth'});
}
function closeM(){
  if(!$('#md').classList.contains('show'))return;
  $('#md').classList.remove('show');document.body.classList.remove('lock');cur=null;
  history.replaceState(null,'',location.pathname+location.search);
  if(stale)render();
}

/* ---------- คลิกทั้งหน้า ---------- */
document.onclick=e=>{
  const t=e.target;
  if(!t.closest('.dd'))closeDD();
  if(t.closest('[data-home]')){reset();return;}
  const ch=t.closest('[data-c]');if(ch){S.cat=ch.dataset.c;render();toList();return;}
  const sg=t.closest('[data-s]');if(sg){S.sort=sg.dataset.s;render();return;}
  const hd=t.closest('[data-hero]');if(hd){setHero(+hd.dataset.hero);return;}
  if(t.closest('[data-jump]')){e.preventDefault();$('#cm').scrollIntoView({behavior:'smooth'});return;}
  if(t.closest('[data-close]')||t.id==='md'){closeM();return;}
  const c=t.closest('[data-i]');if(c){openM(+c.dataset.i,!!c.dataset.j);return;}
  if(t.closest('.send'))sendC();
  const rb=t.closest('[data-r]');if(rb)rate(+rb.dataset.r);
  if(t.closest('#logoutBtn'))logoutM();
  const cd=t.closest('[data-cdel]');if(cd)delMine(cd);
};
document.onkeydown=e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
  if(e.key==='Escape'){if($('#md').classList.contains('show'))closeM();else closeDD();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fimg[data-i]')){e.preventDefault();e.target.click();}
};

/* ================= สมาชิก ================= */
// ต้องเข้าสู่ระบบก่อนใช้เว็บ: ใช้โทเคนสมาชิก หรือโทเคนผู้ดูแล (ถ้าเปิดมาจากหน้า admin)
let ME=null,ADMIN=null;
const MKEY='duffy-member';
let mtoken=null;try{mtoken=localStorage.getItem(MKEY)}catch(_){}
if(!mtoken){try{const a=JSON.parse(localStorage.getItem('duffy-admin')||'null');if(a&&a.token){mtoken=a.token;ADMIN=a.user||'admin';}}catch(_){}}
function hdr(){const h={'Content-Type':'application/json'};if(mtoken)h.Authorization='Bearer '+mtoken;return h;}
// โทเคนหมดอายุ/ใช้ไม่ได้ -> ล้างแล้วไปหน้าเข้าสู่ระบบ (กลับมาหน้าเดิมหลังล็อกอิน)
let leaving=false;
function toLogin(){
  if(leaving)return;leaving=true;
  try{localStorage.removeItem(ADMIN?'duffy-admin':MKEY)}catch(_){}
  location.replace('login.html?next='+encodeURIComponent(location.pathname+location.hash));
}
function renderAcct(){
  $('#acct').innerHTML=ME?`<div class="me" title="${esc(ME.name)} (@${esc(ME.username)})"><span class="av">${esc(([...ME.name][0]||'?').toUpperCase())}</span><span class="nm">${esc(ME.name)}</span></div><button class="out" id="logoutBtn" aria-label="ออกจากระบบ" title="ออกจากระบบ">${I.out}<span class="t">ออกจากระบบ</span></button>`
    :ADMIN?`<a class="out" href="admin.html">หน้าผู้ดูแล</a>`:'';
}
// ฟอร์มความคิดเห็น: สมาชิกใช้ชื่อจากบัญชี
function cform(){
  const box=`<textarea id="ct" maxlength="500" rows="3" placeholder="แสดงความคิดเห็นเกี่ยวกับเกมนี้..."></textarea><button class="send">ส่งความคิดเห็น</button><span id="cmsg"></span>`;
  if(ME)return `<div class="cf"><span class="asme">แสดงความคิดเห็นในชื่อ <b>${esc(ME.name)}</b></span>${box}</div>`;
  if(ADMIN)return `<div class="need">คุณเข้าใช้ในฐานะผู้ดูแล ต้องใช้บัญชีสมาชิกเพื่อแสดงความคิดเห็น</div>`;
  return '';
}
async function logoutM(){
  try{await fetch(`${API}/api/auth/logout`,{method:'POST',headers:hdr()})}catch(_){}
  try{localStorage.removeItem(MKEY)}catch(_){}
  location.replace('login.html?out=1');
}
async function loadMember(){
  if(!mtoken)return toLogin();
  try{const r=await fetch(`${API}${ADMIN?'/api/admin/me':'/api/auth/me'}`,{headers:hdr()});
    if(r.status===401)return toLogin();
    if(r.ok&&!ADMIN){ME=(await r.json()).user;}
  }catch(_){}
  renderAcct();if($('#cfw'))$('#cfw').innerHTML=cform();if(cur&&$('#clist'))loadComments(cur.id);
}
async function delMine(b){
  if(!confirm('ลบความคิดเห็นนี้?'))return;
  try{const r=await fetch(`${API}/api/comments/${encodeURIComponent(b.dataset.cdel)}`,{method:'DELETE',headers:hdr()});
    if(!r.ok)throw new Error(r.status);loadComments(cur.id);}catch(e){alert('ลบไม่สำเร็จ');}
}

/* ---------- เริ่มทำงาน ---------- */
loadMember();
$('#grid').innerHTML='<div class="sk"></div>'.repeat(6);
$('#hin').innerHTML='<div><div class="kick"><i>D</i>Duffy Review</div><h1>กำลังโหลดรีวิว...</h1><p class="site">เซิร์ฟเวอร์ฟรีอาจใช้เวลาตื่นประมาณ 30–50 วินาทีในครั้งแรก</p></div>';
render();
loadAll();
const setViews=(id,n)=>document.querySelectorAll(`[data-vw="${id}"]`).forEach(e=>e.textContent=fmt(n));
async function refreshViews(){if(document.hidden||!ALL.length)return;try{const m=await api('/api/views');for(const id in m){setViews(id,m[id]);const g=ALL.find(x=>x.id==id);if(g)g.views=m[id];}}catch(_){}}
setInterval(refreshViews,15000);
const hm=location.hash.match(/^#game-(\d+)$/);if(hm)openM(+hm[1]);
</script>
