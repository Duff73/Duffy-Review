<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมัครสมาชิก | Duffy Review</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{const t=localStorage.getItem('duffy-theme');if(t)document.documentElement.dataset.theme=t;}catch(_){}</script>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<aside class="show">
  <span class="brand"><i>D</i><span>Duffy <b>Review</b></span></span>
  <div class="cols" id="cols" aria-hidden="true"></div>
  <div class="sin">
    <h2>สมัครฟรี<br>แล้วมาคุยเรื่องเกมกัน</h2>
    <p>อ่านรีวิวได้ทุกเกม ให้ดาว แสดงความคิดเห็นในชื่อของคุณ และแต่งโปรไฟล์ของตัวเองได้</p>
  </div>
</aside>
<main class="main">
<button class="tg" id="tg" type="button" aria-label="สลับโหมดสว่าง/มืด" title="สลับโหมดสว่าง/มืด"></button>
<form class="box" id="f" novalidate>
<a class="mlogo" href="login.html"><i>D</i><span>Duffy <b>Review</b></span></a>
<h1>สร้างบัญชี</h1>
<p class="sub">ไม่ต้องใช้อีเมล ใช้เวลาไม่ถึงนาที</p>
<label>ชื่อผู้ใช้ <small>ใช้ตอนเข้าสู่ระบบ</small><div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><input name="username" autocomplete="username" maxlength="20" autocapitalize="off" spellcheck="false" placeholder="เช่น duffy_gamer" autofocus></div><span class="hint" id="h-username">a-z, 0-9 หรือ _ ยาว 3–20 ตัว</span></label>
<label>ชื่อที่แสดง <small>แสดงในความคิดเห็น</small><div class="fi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><input name="name" autocomplete="nickname" maxlength="30" placeholder="ชื่อที่อยากให้คนอื่นเห็น"></div><span class="hint" id="h-name"></span></label>
<label>รหัสผ่าน<div class="fi pw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input name="password" type="password" autocomplete="new-password" maxlength="100" placeholder="อย่างน้อย 8 ตัวอักษร"><button type="button" class="eye" data-eye>แสดง</button></div><span class="hint" id="h-password">อย่างน้อย 8 ตัวอักษร</span></label>
<label>ยืนยันรหัสผ่าน<div class="fi pw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="m9 15.5 2 2 4-4"/></svg><input name="confirm" type="password" autocomplete="new-password" maxlength="100" placeholder="พิมพ์รหัสผ่านอีกครั้ง"><button type="button" class="eye" data-eye>แสดง</button></div><span class="hint" id="h-confirm"></span></label>
<button class="go" id="go"><span>สมัครสมาชิก</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<div class="msg" id="msg" role="alert"></div>
<div class="alt">มีบัญชีอยู่แล้ว? <a href="login.html" id="toLogin">เข้าสู่ระบบ</a></div>
</form>
</main>
<script src="config.js"></script>
<script src="auth-show.js"></script>
<script>
const API=(window.DUFFY_API_URL||"").replace(/\/$/,"");
const KEY="duffy-member";
const next=(()=>{const n=new URLSearchParams(location.search).get('next')||'';return /^\/(?![\/\\])/.test(n)||/^index\.html/.test(n)?n:'./';})();
if(next!=='./')document.getElementById('toLogin').href='login.html?next='+encodeURIComponent(next);
const f=document.getElementById('f'),msg=document.getElementById('msg'),go=document.getElementById('go');
document.querySelectorAll('[data-eye]').forEach(b=>b.onclick=()=>{const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'แสดง':'ซ่อน';});

// ตรวจแต่ละช่อง คืนข้อความผิดพลาด (ว่าง = ผ่าน)
const rules={
  username:v=>/^[a-z0-9_]{3,20}$/.test(v.trim().toLowerCase())?'':'ต้องเป็น a-z, 0-9 หรือ _ ยาว 3–20 ตัว',
  name:v=>v.trim()?'':'กรุณาใส่ชื่อที่แสดง',
  password:v=>v.length<8?'ต้องยาวอย่างน้อย 8 ตัวอักษร':v.toLowerCase()===f.username.value.trim().toLowerCase()?'ต้องไม่เหมือนชื่อผู้ใช้':'',
  confirm:v=>v===f.password.value?'':'รหัสผ่านไม่ตรงกัน',
};
const okText={username:'ใช้ชื่อนี้ได้',password:'รหัสผ่านใช้ได้',confirm:'รหัสผ่านตรงกัน',name:''};
const defText={username:'a-z, 0-9 หรือ _ ยาว 3–20 ตัว',password:'อย่างน้อย 8 ตัวอักษร',name:'',confirm:''};
function check(k,show){
  const v=f[k].value,err=rules[k](v),h=document.getElementById('h-'+k);
  if(!show&&!v){h.className='hint';h.textContent=defText[k];f[k].classList.remove('bad');return err;}
  h.className='hint '+(err?'er':'ok');h.textContent=err||okText[k];f[k].classList.toggle('bad',!!err);
  return err;
}
for(const k in rules)f[k].addEventListener('input',()=>{check(k);if(k==='password'&&f.confirm.value)check('confirm');});
for(const k in rules)f[k].addEventListener('blur',()=>{if(f[k].value)check(k,true);});

f.onsubmit=async e=>{
  e.preventDefault();msg.textContent='';
  const bad=Object.keys(rules).find(k=>check(k,true));
  if(bad){f[bad].focus();return;}
  go.disabled=true;go.firstElementChild.textContent='กำลังสมัคร...';
  try{
    const r=await fetch(API+'/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({username:f.username.value.trim().toLowerCase(),name:f.name.value.trim(),password:f.password.value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){
      if(d.field&&f[d.field]){const h=document.getElementById('h-'+d.field);h.className='hint er';h.textContent=d.error;f[d.field].classList.add('bad');f[d.field].focus();}
      else msg.textContent=d.error||('เกิดข้อผิดพลาด ('+r.status+')');
      return;
    }
    try{localStorage.setItem(KEY,d.token)}catch(_){}
    location.replace(next);
  }catch(_){msg.textContent='เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ (เซิร์ฟเวอร์ฟรีอาจใช้เวลาตื่น 30–50 วินาที ลองใหม่อีกครั้ง)';}
  finally{go.disabled=false;go.firstElementChild.textContent='สมัครสมาชิก';}
};
</script>
</body>
</html>
